<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The memory system, end to end</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f5f4f0; --panel:#ffffff; --sunk:#edebe5; --tx:#1b1b19; --tx2:#57564f; --tx3:#8a887f;
  --bd:#d8d5cc; --bd2:#b7b3a8; --wire:#a09c91;
  --a1:#c1502a; --a1bg:#fbe6dc;   /* tag / stores / writeback */
  --a2:#0f7f5e; --a2bg:#d9f0e7;   /* index / fills / L1 */
  --a3:#5f4cc2; --a3bg:#e8e4fb;   /* offset / ROB */
  --a4:#2a67aa; --a4bg:#dbe8f6;   /* data / loads */
  --ok:#2b8538; --okbg:#dff1dd; --bad:#c0372c; --badbg:#fbe0dd;
  --act:#bf800d; --actbg:#fbedd0;
  --mono:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121215; --panel:#1a1a1f; --sunk:#101013; --tx:#ecebe6; --tx2:#a5a39b; --tx3:#74726c;
    --bd:#2c2c34; --bd2:#43434d; --wire:#5a5a65;
    --a1:#f08b62; --a1bg:#3a2016; --a2:#4fd0a4; --a2bg:#0f2f28; --a3:#ab99f7; --a3bg:#241d40;
    --a4:#79b1ee; --a4bg:#16283d; --ok:#6fd07c; --okbg:#15301a; --bad:#ff7b6f; --badbg:#3b1715;
    --act:#f2b646; --actbg:#3a2b0f;
  }
}
:root[data-theme="dark"]{
  --bg:#121215; --panel:#1a1a1f; --sunk:#101013; --tx:#ecebe6; --tx2:#a5a39b; --tx3:#74726c;
  --bd:#2c2c34; --bd2:#43434d; --wire:#5a5a65;
  --a1:#f08b62; --a1bg:#3a2016; --a2:#4fd0a4; --a2bg:#0f2f28; --a3:#ab99f7; --a3bg:#241d40;
  --a4:#79b1ee; --a4bg:#16283d; --ok:#6fd07c; --okbg:#15301a; --bad:#ff7b6f; --badbg:#3b1715;
  --act:#f2b646; --actbg:#3a2b0f;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 60px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
code,.mono{font-family:var(--mono);font-size:.9em}
button{font:500 13px var(--sans);padding:8px 12px;border-radius:8px;border:1px solid var(--bd2);background:var(--panel);color:var(--tx);cursor:pointer}
button:hover{border-color:var(--tx3)}
button:active{transform:scale(.98)}
button:disabled{opacity:.4;cursor:default;transform:none}
button.pri{border-color:var(--act);color:var(--act)}
button.on{background:var(--actbg);border-color:var(--act);color:var(--act)}
input,select{font:13px var(--mono);padding:7px 9px;border:1px solid var(--bd2);border-radius:7px;background:var(--sunk);color:var(--tx);min-width:0}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--bd);padding-top:env(safe-area-inset-top,0px)}
.topin{max-width:1320px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:12px}
.brand{font-weight:600;font-size:15px;white-space:nowrap}
.brand small{display:block;font-weight:400;font-size:11.5px;color:var(--tx3)}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;padding:2px 0}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;font-size:12.5px;color:var(--tx2);text-decoration:none;padding:6px 10px;border-radius:7px;border:1px solid transparent;white-space:nowrap}
.nav a b{font-family:var(--mono);font-weight:500;color:var(--tx3);margin-right:5px;font-size:11px}
.nav a:hover{border-color:var(--bd)}
.nav a.cur{background:var(--panel);border-color:var(--bd2);color:var(--tx)}
.nav a.cur b{color:var(--act)}
.cfgbtn{flex:none}

.wrap{max-width:1320px;margin:0 auto;padding:22px 14px 60px}
.ch{display:none}
.ch.show{display:block}
.chh{margin-bottom:16px}
.chh .num{font-family:var(--mono);font-size:12px;color:var(--act);letter-spacing:.06em}
.chh h1{font-size:25px;font-weight:600;margin:2px 0 6px;letter-spacing:-.01em}
.chh p{margin:0;color:var(--tx2);max-width:880px}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:14px 16px}
.card h3{font-size:14px;font-weight:600;margin:0 0 8px}
.card p{margin:0 0 8px;font-size:14px;color:var(--tx2)}
.card p:last-child{margin-bottom:0}
.card b{color:var(--tx);font-weight:600}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:860px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.stack>*+*{margin-top:12px}
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--panel);border:1px solid var(--bd);border-radius:12px}
.scroller svg{display:block;width:100%;height:auto}
.note{font-size:12.5px;color:var(--tx3)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;border:1px solid var(--bd);color:var(--tx2);vertical-align:1px}
.tag.ok{background:var(--okbg);color:var(--ok);border-color:transparent}
.tag.bad{background:var(--badbg);color:var(--bad);border-color:transparent}
.tag.act{background:var(--actbg);color:var(--act);border-color:transparent}
.tag.pub{background:var(--sunk);color:var(--tx3)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.kv dt{color:var(--tx3)}
.kv dd{margin:0;font-family:var(--mono);font-size:12.5px}

/* ---------- glossary term ---------- */
dfn{font-style:normal;border-bottom:1px dotted var(--tx3);cursor:help}
dfn:hover{border-bottom-color:var(--act);color:var(--tx)}
.pop{position:fixed;z-index:60;max-width:360px;background:var(--panel);border:1px solid var(--bd2);border-radius:10px;padding:10px 12px;font-size:13px;box-shadow:0 8px 28px rgba(0,0,0,.18);display:none}
.pop b{display:block;font-size:13.5px;margin-bottom:3px}
.pop p{margin:0;color:var(--tx2)}

/* ---------- stepper ---------- */
.stp{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stp .cnt{font-family:var(--mono);font-size:12px;color:var(--tx3);min-width:64px;text-align:center}
.stp .grow{flex:1}
.pills{display:flex;flex-wrap:wrap;gap:4px}
.pill{font-size:11px;padding:2px 8px;border-radius:6px;border:1px solid var(--bd);color:var(--tx3);cursor:pointer;background:transparent}
.pill.done{color:var(--tx2)}
.pill.cur{background:var(--actbg);color:var(--act);border-color:var(--act)}
.narr{border-left:3px solid var(--act);padding:10px 14px;background:var(--panel);border-radius:0 10px 10px 0;border-top:1px solid var(--bd);border-right:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.narr h4{margin:0 0 4px;font-size:15px;font-weight:600}
.narr p{margin:0;font-size:14px;color:var(--tx2)}
.narr p+p{margin-top:6px}
.narr b{color:var(--tx);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--bd2);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;border-radius:0;border-right:1px solid var(--bd);padding:7px 11px;background:var(--panel)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--actbg);color:var(--act)}

/* ---------- config drawer ---------- */
.drawer{position:fixed;inset:0;z-index:70;display:none;background:rgba(0,0,0,.35)}
.drawer.show{display:block}
.drawer .in{position:absolute;right:0;top:0;bottom:0;width:min(420px,100%);background:var(--panel);border-left:1px solid var(--bd);padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 18px);overflow:auto}
.drawer h2{font-size:17px;margin:0 0 6px}
.drawer label{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;font-size:13px;margin:8px 0}
.drawer label span small{display:block;color:var(--tx3);font-size:11.5px}

/* ---------- svg common ---------- */
svg text{font-family:var(--sans);fill:var(--tx2);font-size:12px}
svg .h{fill:var(--tx);font-weight:600;font-size:13px}
svg .s{fill:var(--tx3);font-size:10.5px}
svg .m{font-family:var(--mono)}
svg .box{fill:var(--panel);stroke:var(--bd2);stroke-width:1.1}
svg .sunk{fill:var(--sunk);stroke:var(--bd);stroke-width:1}
svg .wire{stroke:var(--wire);stroke-width:1.3;fill:none}
svg .bus{stroke:var(--wire);stroke-width:3;fill:none}
svg .on.box,svg .on .box{stroke:var(--act);stroke-width:2;fill:var(--actbg)}
svg .on.wire,svg .on .wire{stroke:var(--act);stroke-width:2.4}
svg .on.bus,svg .on .bus{stroke:var(--act);stroke-width:4}
svg .okb{fill:var(--okbg);stroke:var(--ok);stroke-width:1.8}
svg .badb{fill:var(--badbg);stroke:var(--bad);stroke-width:1.8}
svg .a1b{fill:var(--a1bg);stroke:var(--a1);stroke-width:1.2}
svg .a2b{fill:var(--a2bg);stroke:var(--a2);stroke-width:1.2}
svg .a3b{fill:var(--a3bg);stroke:var(--a3);stroke-width:1.2}
svg .a4b{fill:var(--a4bg);stroke:var(--a4);stroke-width:1.2}
svg .dim{opacity:.35}
svg .flow{fill:none;stroke-width:3;stroke-dasharray:7 5}
@media (prefers-reduced-motion:no-preference){ svg .flow{animation:dash .9s linear infinite} }
@keyframes dash{to{stroke-dashoffset:-24}}
svg .click{cursor:pointer}
svg .click:hover .box{stroke:var(--act)}

.c2u{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:12px}
@media (max-width:860px){.c2u{grid-template-columns:minmax(0,1fr)}}
.src{font:12.5px/1.75 var(--mono);background:var(--sunk);border-radius:8px;padding:8px 0;overflow-x:auto}
.src .ln{padding:0 10px;white-space:nowrap;cursor:pointer;border-left:3px solid transparent}
.src .ln:hover{background:color-mix(in srgb,var(--act) 8%,transparent)}
.src .ln.hl{background:var(--actbg)}
.src .ln.sel{background:var(--actbg);border-left-color:var(--act)}
.src .no{display:inline-block;width:26px;color:var(--tx3);user-select:none}
.src .bytes{display:inline-block;width:200px;color:var(--a1)}
.src .ins{color:var(--tx)}
.src .lab{color:var(--a3);padding-left:0;margin-top:2px}
svg .bc{fill:var(--a4bg);stroke:var(--a4);stroke-width:1}
svg .bc.bsel{fill:var(--actbg);stroke:var(--act);stroke-width:2}
.bstream{display:flex;flex-wrap:wrap;gap:3px;font:12.5px var(--mono);margin:6px 0 10px}
.bstream span{padding:2px 5px;border-radius:4px;background:var(--sunk)}
.bstream em{font-style:normal;display:inline-flex;gap:3px;padding:2px;border-radius:6px;margin-right:6px}
.bstream em.g0{background:var(--a4bg)}.bstream em.g1{background:var(--a2bg)}
.bstream em span{background:transparent}
.fields{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.fld{border:1.5px solid;border-radius:8px;padding:4px 10px;text-align:center}
.fld code{display:block;font-size:14px;font-weight:600}
.fld span{font-size:11px}
.fld.a1{border-color:var(--a1);background:var(--a1bg);color:var(--a1)}
.fld.a2{border-color:var(--a2);background:var(--a2bg);color:var(--a2)}
.fld.a3{border-color:var(--a3);background:var(--a3bg);color:var(--a3)}
.fld.a4{border-color:var(--a4);background:var(--a4bg);color:var(--a4)}
.fld.act{border-color:var(--act);background:var(--actbg);color:var(--act)}
.bitrow{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 10px}
.bg{text-align:center}
.bb{display:flex;gap:2px}
.bb i{font:600 13px var(--mono);font-style:normal;width:20px;height:24px;line-height:24px;border:1px solid var(--bd2);border-radius:4px;background:var(--sunk)}
.bl{font-size:11px;color:var(--tx3);margin-top:2px}
.bv{font:12px var(--mono);color:var(--act)}
.unote{font-family:var(--sans)!important;color:var(--tx3);font-size:12px!important;padding-top:0!important}
.route{margin:0;padding-left:0;list-style:none;font-size:14px;color:var(--tx2)}
.route li{margin:5px 0}
.route b{font-family:var(--mono);color:var(--act);margin-right:6px}

.mt{border-collapse:collapse;width:100%;font-size:12.5px}
.mt th{text-align:left;font-weight:600;color:var(--tx3);font-size:11px;padding:3px 6px;border-bottom:1px solid var(--bd)}
.mt td{padding:3px 6px;border-bottom:1px solid var(--bd);font-family:var(--mono);font-size:12px}
.mt tr:last-child td{border-bottom:0}
.mt tr.chg td{background:var(--actbg);color:var(--act)}
.mt td dfn{font-family:var(--sans)}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.pgrid{grid-template-columns:minmax(0,1fr)}}
.pp h3{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lane{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:4px 0;font-size:12px}
.lane>span{font:600 11px var(--mono);color:var(--tx3);width:26px}
.lane i{font:normal 11.5px var(--mono);padding:1px 6px;border-radius:5px;background:var(--a4bg);color:var(--a4)}
.lane em{font-style:normal;color:var(--tx3);font-size:11.5px}
.prfg{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:3px}
.pr{border:1px solid var(--bd);border-radius:5px;padding:2px 4px;font-size:10.5px;line-height:1.25;min-height:32px}
.pr b{display:block;font:600 10px var(--mono);color:var(--tx3)}
.pr span{font-family:var(--mono)}
.pr.free{opacity:.35}
.pr.pend{border:1.5px dashed var(--a4);background:var(--a4bg)}
.pr.rdy{background:var(--okbg);border-color:var(--ok)}
.pr.nw{outline:2px solid var(--act)}
.su{display:flex;gap:4px;align-items:center;font-size:12px;margin:3px 0;flex-wrap:wrap}
.su b{font:600 11.5px var(--mono);min-width:56px}
.su span{font:11px var(--mono);padding:0 5px;border-radius:4px}
.su span.r{background:var(--okbg);color:var(--ok)}
.su span.n{background:var(--sunk);color:var(--tx3)}
.evl{margin:0;padding-left:18px;font-size:13.5px;color:var(--tx2)}
.evl li{margin:3px 0}
.evl b{color:var(--tx);font-family:var(--mono);font-size:12.5px}
.ring{width:100%;max-width:280px;display:block;margin:0 auto}
.gantt-w{overflow:auto;max-height:560px;border:1px solid var(--bd);border-radius:8px}
.gantt{border-collapse:separate;border-spacing:0;font:10.5px var(--mono)}
.gantt th{position:sticky;top:0;background:var(--panel);z-index:2;font-weight:500;color:var(--tx3);padding:3px 2px;min-width:24px;cursor:pointer;border-bottom:1px solid var(--bd);white-space:nowrap}
.gantt td{padding:1px 2px;text-align:center;min-width:24px;height:18px;border-right:1px solid color-mix(in srgb,var(--bd) 45%,transparent)}
.gantt .lbl{position:sticky;left:0;background:var(--panel);z-index:1;text-align:left;padding:1px 8px;min-width:70px;border-right:1px solid var(--bd)}
.gantt thead .lbl{z-index:3}
.gantt td.fe{background:var(--a4bg);color:var(--a4)}
.gantt td.uq{background:var(--sunk);color:var(--tx3)}
.gantt td.rn{background:var(--a3bg);color:var(--a3)}
.gantt td.wt{color:var(--tx3)}
.gantt td.is{background:var(--actbg);color:var(--act);font-weight:600}
.gantt td.ex{background:var(--a2bg);color:var(--a2)}
.gantt td.mm{background:var(--a4bg);color:var(--a4);font-weight:600}
.gantt td.ms{background:var(--badbg);color:var(--bad)}
.gantt td.wb{background:var(--okbg);color:var(--ok)}
.gantt td.rt{background:var(--a3);color:#fff;font-weight:600}
.gantt td.sb{background:var(--a1bg);color:var(--a1)}
.gantt td.cm{background:var(--a1);color:#fff;font-weight:600}
.gantt td.xx{background:var(--badbg);color:var(--bad);font-weight:700}
.gantt td.fut{background:transparent!important;color:transparent!important}
.gantt td.cur,.gantt th.cur{box-shadow:inset 2px 0 0 var(--act),inset -2px 0 0 var(--act)}
.gantt tr.sqd td.lbl{color:var(--bad);text-decoration:line-through}
.gantt tr.act td.lbl{color:var(--act);font-weight:600}
svg .slot{fill:var(--sunk);stroke:var(--bd);stroke-width:1}
svg .slot.wait{fill:var(--a4bg);stroke:var(--a4)}
svg .slot.rdy{fill:var(--okbg);stroke:var(--ok)}
svg .slot.exec{fill:var(--actbg);stroke:var(--act)}
svg .slot.done{fill:var(--okbg);stroke:var(--ok)}
svg .slot.miss{fill:var(--badbg);stroke:var(--bad)}
svg .slot.sen{fill:var(--a3bg);stroke:var(--a3)}
svg .slt{font-size:9px;fill:var(--tx)}

.kchain{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:900px){.kchain{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kchain>div{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;background:var(--sunk);position:relative}
.kchain>div.on{border-color:var(--act);background:var(--actbg)}
.kchain code{font-size:12px;font-weight:600;color:var(--tx)}
.kchain span{display:block;font:11px var(--mono);color:var(--tx3)}
.kchain p{margin:4px 0 0;font-size:12.5px;color:var(--tx2)}


.cohbtns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:760px){.cohbtns{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cohbtns>div{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.cohbtns>div b{width:100%;font-size:12.5px}
.cohbtns button{padding:5px 8px;font-size:12px}

.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.glist .card h3{margin-bottom:4px}
button.lnk{padding:3px 8px;font-size:11.5px}

</style>
</head>
<body>
<header class="top"><div class="topin">
  <div class="brand">Memory, end to end<small>Ryzen 7 3750H &middot; Zen+</small></div>
  <nav class="nav" id="nav"></nav>
  <button class="cfgbtn" id="cfgOpen" title="Latency settings">latencies</button>
</div></header>
<main class="wrap" id="main"></main>
<div class="pop" id="pop"></div>
<div class="drawer" id="cfg"><div class="in" id="cfgIn"></div></div>
<script>
/* ======================= core ======================= */
var App = (function(){
  var NS = 'http://www.w3.org/2000/svg';
  function s(tag, attrs, parent, text){
    var e = document.createElementNS(NS, tag);
    if (attrs) for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }
  function h(tag, attrs, parent, html){
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs){ if (k === 'class') e.className = attrs[k]; else e.setAttribute(k, attrs[k]); }
    if (html !== undefined) e.innerHTML = html;
    if (parent) parent.appendChild(e);
    return e;
  }
  function hx(v, w){ var t = (typeof v === 'bigint' ? v : BigInt(v)).toString(16); if (w) t = t.padStart(w, '0'); return '0x' + t; }
  function hb(v){ return v.toString(16).padStart(2, '0'); }

  /* ---------- the running example: one program, one set of addresses ---------- */
  var EX = {
    fn: 0x555555555180n, loop: 0x555555555190n, ret: 0x5555555551a1n,
    data: 0x55555555a2c0n, hist: 0x7ffd4a3c2a80n, rsp: 0x7ffd4a3c2a58n, retAddr: 0x5555555552d4n,
    n: 3, bytes: [123, 123, 7, 46, 200, 123], histInit: {123: 41, 7: 9, 46: 3, 200: 17},
    /* VA page -> PFN, fixed for every chapter */
    pages: { '555555555': 0x2b4e1n, '55555555a': 0x1c07an, '7ffd4a3c2': 0x1a3f7cn, '7ffd4a3c3': 0x0f9d2n },
    cr3: 0x10a3b000n
  };
  EX.histAddr = function(k){ return EX.hist + BigInt(k) * 8n; };
  EX.pa = function(va){
    var vpn = (va >> 12n).toString(16), pfn = EX.pages[vpn];
    return pfn === undefined ? null : (pfn << 12n) | (va & 0xfffn);
  };

  /* ---------- latency config (published ballpark defaults; user can overwrite with measurements) ---------- */
  var CFG = { ghz: 4.0, l1: 4, l2: 12, l3: 35, dramNs: 90, tscGhz: 2.297 };
  var CFG_DEF = JSON.parse(JSON.stringify(CFG));
  try { var sv = localStorage.getItem('memE2E.cfg'); if (sv){ var o = JSON.parse(sv); for (var k in o) if (k in CFG) CFG[k] = +o[k]; } } catch(e){}
  var cfgListeners = [];

  /* ---------- glossary ---------- */
  var G = {};
  function gloss(key, title, def){ G[key] = {t: title, d: def}; }
  function g(key, label){ return '<dfn data-g="' + key + '">' + (label || (G[key] ? G[key].t : key)) + '</dfn>'; }

  /* ---------- chapters + router ---------- */
  var chapters = [], built = {}, cur = null;
  function chapter(def){ chapters.push(def); }
  function show(id){
    var ch = chapters.filter(function(c){ return c.id === id; })[0] || chapters[0];
    if (!built[ch.id]){
      var sec = h('section', {'class': 'ch', id: 'ch-' + ch.id}, document.getElementById('main'));
      var hd = h('div', {'class': 'chh'}, sec);
      h('div', {'class': 'num'}, hd, 'CHAPTER ' + ch.num);
      h('h1', null, hd, ch.title);
      if (ch.sub) h('p', null, hd, ch.sub);
      var body = h('div', {'class': 'stack'}, sec);
      built[ch.id] = {sec: sec, api: ch.build(body) || {}};
    }
    for (var k in built) built[k].sec.classList.toggle('show', k === ch.id);
    cur = ch.id;
    var links = document.querySelectorAll('#nav a');
    for (var i = 0; i < links.length; i++) links[i].classList.toggle('cur', links[i].dataset.id === ch.id);
    var a = document.querySelector('#nav a.cur'); if (a && a.scrollIntoView) a.scrollIntoView({block: 'nearest', inline: 'center'});
    if (built[ch.id].api.onShow) built[ch.id].api.onShow();
  }
  function go(id){ if (location.hash !== '#' + id) location.hash = id; else show(id); window.scrollTo(0, 0); }
  function start(){
    var nav = document.getElementById('nav');
    chapters.forEach(function(c){
      var a = h('a', {href: '#' + c.id}, nav, '<b>' + c.num + '</b>' + c.short);
      a.dataset.id = c.id;
    });
    window.addEventListener('hashchange', function(){ show(location.hash.slice(1)); window.scrollTo(0, 0); });
    show(location.hash.slice(1) || chapters[0].id);
    initPop(); initCfg();
    document.addEventListener('keydown', function(e){
      if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
      var api = built[cur] && built[cur].api;
      if (api && api.key && api.key(e.key)) e.preventDefault();
    });
  }

  /* ---------- popover ---------- */
  function initPop(){
    var pop = document.getElementById('pop');
    function place(t){
      var r = t.getBoundingClientRect(), w = Math.min(360, window.innerWidth - 20);
      pop.style.maxWidth = w + 'px';
      pop.style.display = 'block';
      var ph = pop.offsetHeight, x = Math.max(10, Math.min(r.left, window.innerWidth - w - 10));
      var y = r.bottom + 8; if (y + ph > window.innerHeight - 10) y = Math.max(10, r.top - ph - 8);
      pop.style.left = x + 'px'; pop.style.top = y + 'px';
    }
    document.addEventListener('click', function(e){
      var t = e.target.closest && e.target.closest('dfn[data-g]');
      if (t){
        var d = G[t.dataset.g];
        pop.innerHTML = d ? '<b>' + d.t + '</b><p>' + d.d + '</p>' : '<b>' + t.dataset.g + '</b><p>(no entry)</p>';
        place(t); e.stopPropagation(); return;

      if (!e.target.closest('#pop')) pop.style.display = 'none';

  /* ---------- config drawer ---------- */
  function initCfg(){
    var dr = document.getElementById('cfg'), inn = document.getElementById('cfgIn');
    var rows = [
      ['ghz', 'Core clock (GHz)', '3750H max boost is 4.0; base 2.3'],
      ['l1', 'L1d load-to-use (cycles)', 'published Zen+: 4'],
      ['l2', 'L2 load-to-use (cycles)', 'published Zen+: 12 minimum'],
      ['l3', 'L3 load-to-use (cycles)', 'published Zen/Zen+ average: ~35'],
      ['dramNs', 'DRAM extra latency beyond L3 (ns)', 'ballpark only; depends on DIMMs'],
      ['tscGhz', 'TSC frequency (GHz)', 'measure your own with RDTSC against CLOCK_MONOTONIC']
    ];
    var html = '<h2>Latency settings</h2><p class="note">Defaults are published Zen/Zen+ figures (WikiChip, 7-cpu.com), <b>not measurements from your machine</b>. Measure your own cache and DRAM latencies (a pointer-chase, working-set-size sweep is the standard technique) and enter the plateau values here; every chapter re-runs with the new numbers.</p>';
    rows.forEach(function(r){ html += '<label><span>' + r[1] + '<small>' + r[2] + '</small></span><input type="number" step="any" min="0" data-k="' + r[0] + '" value="' + CFG[r[0]] + '"></label>'; });
    html += '<p class="note" id="cfgDram"></p><div style="display:flex;gap:8px;margin-top:12px"><button id="cfgReset">reset to published</button><button class="pri" id="cfgClose" style="margin-left:auto">close</button></div>';
    inn.innerHTML = html;
    function upd(){ document.getElementById('cfgDram').textContent = 'DRAM load-to-use at these settings: ' + dramCycles() + ' cycles = ' + (dramCycles() / CFG.ghz).toFixed(1) + ' ns.'; }
    upd();
    inn.addEventListener('change', function(e){
      var k = e.target.dataset && e.target.dataset.k; if (!k) return;
      var v = parseFloat(e.target.value); if (!(v > 0)){ e.target.value = CFG[k]; return; }
      CFG[k] = v; try { localStorage.setItem('memE2E.cfg', JSON.stringify(CFG)); } catch(er){}
      upd(); cfgListeners.forEach(function(f){ f(); });
    });
    document.getElementById('cfgReset').onclick = function(){
      for (var k in CFG_DEF) CFG[k] = CFG_DEF[k];
      var ins = inn.querySelectorAll('input'); for (var i = 0; i < ins.length; i++) ins[i].value = CFG[ins[i].dataset.k];
      try { localStorage.removeItem('memE2E.cfg'); } catch(er){}
      upd(); cfgListeners.forEach(function(f){ f(); });
    };
    document.getElementById('cfgOpen').onclick = function(){ dr.classList.add('show'); };
    document.getElementById('cfgClose').onclick = function(){ dr.classList.remove('show'); };
    dr.addEventListener('click', function(e){ if (e.target === dr) dr.classList.remove('show'); });
  }

  /* ---------- stepper: frames = [{t: title, d: html, ...}] ---------- */
  function stepper(parent, opts){
    var wrap = h('div', {'class': 'stack'}, parent);
    var bar = h('div', {'class': 'stp'}, wrap);
    var bBack = h('button', null, bar, '&larr; back');
    var cnt = h('span', {'class': 'cnt'}, bar);
    var bNext = h('button', {'class': 'pri'}, bar, 'next &rarr;');
    var bReset = h('button', null, bar, 'restart');
    h('span', {'class': 'grow'}, bar);
    var pills = h('div', {'class': 'pills'}, bar);
    var narr = h('div', {'class': 'narr'}, wrap);
    var frames = [], i = 0;
    function render(){
      var f = frames[i];
      cnt.textContent = (i + 1) + ' / ' + frames.length;
      bBack.disabled = i === 0; bNext.disabled = i === frames.length - 1;
      narr.innerHTML = '<h4>' + f.t + '</h4>' + (f.d.charAt(0) === '<' ? f.d : '<p>' + f.d + '</p>');
      var ps = pills.children;
      for (var k = 0; k < ps.length; k++) ps[k].className = 'pill' + (k === i ? ' cur' : k < i ? ' done' : '');
      opts.render(f, i);
    }
    function set(fr, keep){
      frames = fr; if (!keep || i >= frames.length) i = 0;
      pills.innerHTML = '';
      if (opts.pills !== false) frames.forEach(function(f, k){
        var p = h('button', {'class': 'pill'}, pills, f.p || String(k + 1));
        p.onclick = function(){ i = k; render(); };
      });
      render();
    }
    bBack.onclick = function(){ if (i > 0){ i--; render(); } };
    bNext.onclick = function(){ if (i < frames.length - 1){ i++; render(); } };
    bReset.onclick = function(){ i = 0; render(); };
    return {
      el: wrap, set: set, render: render,
      key: function(k){ if (k === 'ArrowRight'){ bNext.onclick(); return true; } if (k === 'ArrowLeft'){ bBack.onclick(); return true; } return false; },
      get i(){ return i; }, go: function(k){ i = Math.max(0, Math.min(frames.length - 1, k)); render(); }
    };
  }

  function seg(parent, items, onPick, init){
    var w = h('div', {'class': 'seg'}, parent), bs = [];
    items.forEach(function(it, k){
      var b = h('button', null, w, it[1]); bs.push(b);
      b.onclick = function(){ bs.forEach(function(x){ x.classList.remove('on'); }); b.classList.add('on'); onPick(it[0]); };
      if (it[0] === init) b.classList.add('on');
    });
    return w;
  }

  return {s: s, h: h, hx: hx, hb: hb, EX: EX, CFG: CFG, dramCycles: dramCycles, onCfg: onCfg,
          gloss: gloss, g: g, G: G, chapter: chapter, start: start, go: go, stepper: stepper, seg: seg};
})();

/* ======================= glossary ======================= */
(function(){
var d = App.gloss;
/* --- instructions and front end --- */
d('isa','ISA','Instruction set architecture: the contract between software and hardware (x86-64 here). It fixes what each instruction does to registers and memory, not how the silicon does it.');
d('uop','µop (micro-op)','A simple internal operation the core actually schedules and executes. One x86 instruction becomes one or more µops.');
d('mop','macro-op','AMD\'s tracking unit between x86 instructions and µops. On Zen a macro-op can carry a load, an ALU operation and a store together; the retire queue tracks macro-ops.');
d('pc','PC / RIP','Program counter: the virtual address of the next instruction to fetch. Called RIP on x86-64.');
d('bp','branch predictor','Hardware that guesses, before decode, whether a branch is taken and where it goes, so fetch never waits for the branch to execute.');
d('btb','BTB','Branch target buffer: a cache keyed by fetch address that remembers where previously seen branches jumped. A BTB hit lets fetch redirect in the same cycle.');
d('ras','RAS','Return address stack: a small hardware stack that pushes on CALL and pops on RET to predict return targets.');
d('l1i','L1i','Level-1 instruction cache. 64 KB, 4-way on your Zen+ core. Fetch reads 32 bytes per cycle from it.');
d('itlb','iTLB','Instruction TLB: translates the fetch address (virtual) to a physical address for the L1i tag check.');
d('fetchwin','fetch window','The aligned block of bytes fetch reads in one cycle (32 bytes on Zen+). Instructions are carved out of it afterwards.');
d('predecode','predecode / pick','Finds where each variable-length x86 instruction starts and ends inside the fetch window, so decoders get whole instructions.');
d('decode','decode','Translates x86 instructions into macro-ops / µops. Zen+ decodes up to 4 x86 instructions per cycle.');
d('opcache','op cache','A cache of already-decoded µops, keyed by instruction address. A hit skips predecode and decode entirely. 2K entries on Zen/Zen+.');
d('uq','µop queue','A buffer between decode and rename that absorbs rate mismatches between the front end and the back end.');
d('fusion','macro-fusion','Merging a compare/test with the following conditional jump into one operation. On Zen it happens at dispatch; this model shows it fused from decode on for readability.');
d('zx','zero extension','Filling the upper bits of a wider destination with zeros. movzbl reads 1 byte and writes 32 bits; writing a 32-bit register also zeroes bits 63:32.');
d('modrm','ModRM / SIB','Encoding bytes that say which registers and addressing form an instruction uses. SIB adds scale, index and base for addresses like (%rdx,%rax,8).');
d('rex','REX prefix','A prefix byte (0x40-0x4F) that enables 64-bit operand size (REX.W) and access to r8-r15.');
/* --- rename / OoO --- */
d('rename','register renaming','Mapping each architectural register write to a fresh physical register, so only true data dependencies (RAW) remain.');
d('rat','RAT','Register alias table: for every architectural register, the physical register currently holding its newest value. Read for sources, written for destinations at rename.');
d('crat','committed RAT','The architectural-state copy of the RAT, updated only at retirement. After a squash the speculative RAT is rebuilt from it.');
d('prf','PRF','Physical register file: the actual storage for register values. Zen+ has 168 integer entries; each has a ready bit.');
d('freelist','free list','The list of physical registers holding nothing live. Rename takes from it; retirement (and squash) give registers back.');
d('dispatch','dispatch / allocate','Placing renamed operations into the back end: one retire-queue entry, scheduler entries, and load/store-queue entries. Stalls if any of those is full.');
d('rob','ROB / retire queue','Reorder buffer: an in-order circular buffer of every in-flight instruction. Instructions enter in program order, may finish out of order, and leave (retire) only from the head, in order. 192 entries on Zen+ (96 per SMT thread).');
d('sched','scheduler','A queue of waiting µops that watches for their source operands to become ready and picks ready ones for execution. Zen+ has four 14-entry ALU schedulers and two 14-entry AGU schedulers.');
d('wakeup','wakeup','When a µop\'s result is about to be produced, its destination tag is broadcast to the schedulers; waiting µops that need that tag mark the operand ready.');
d('issue','issue / select','Each cycle, each execution port takes the oldest ready µop from its scheduler.');
d('port','execution port','An entry point into a functional unit. Zen+ integer side: 4 ALU ports and 2 AGU ports.');
d('alu','ALU','Arithmetic-logic unit: adds, compares, logic, shifts, branch resolution.');
d('agu','AGU','Address generation unit: computes base + index*scale + displacement for loads and stores.');
d('bypass','bypass network','Wires that forward a result straight from a unit\'s output to the next µop\'s input, without a round trip through the register file.');
d('lsu','load/store unit','The part of the core that holds in-flight loads and stores, translates their addresses and accesses the L1d.');
d('lq','load queue','Holds every in-flight load in program order until it retires. 44 entries on Zen+.');
d('sq','store queue / store buffer','Holds every in-flight store (address + data) in program order. Before retirement it enables forwarding; after retirement its entries are committed to the L1d one at a time. 44 entries on Zen+.');
d('sta','store-address µop','The half of a store that computes the address (on an AGU) and writes it into the store-queue entry.');
d('std','store-data µop','The half of a store that delivers the value to be stored into the store-queue entry.');
d('stlf','store-to-load forwarding','A load whose address matches an older, not-yet-committed store takes its value from the store queue instead of the cache.');
d('disamb','memory disambiguation','Deciding whether a load may run before older stores whose addresses are still unknown. Hardware predicts \'no overlap\' and replays the load if that turns out wrong.');
d('retire','retire','The in-order step where a finished instruction\'s results become architectural state: its old physical registers are freed and its store becomes eligible to commit.');
d('commit','store commit','Writing a retired store from the store queue into the L1d. Only here does the store become visible to other cores.');
d('senior','senior store','A store that has retired but still sits in the store queue waiting to commit. It must still forward to younger loads.');
d('squash','squash / flush','Discarding every instruction younger than a mispredicted branch (or a faulting instruction): their ROB, scheduler, queue entries and physical registers are released.');
d('mispredict','misprediction','The branch predictor guessed wrong. Detected when the branch executes; costs the refill time of the front end \u2014 tens of cycles, and directly measurable with a branch-heavy loop over sorted vs. random data.');
d('spec','speculative execution','Executing instructions before it is known that they are on the correct path. Their effects stay inside the core until retirement.');
d('smt','SMT','Simultaneous multithreading: two hardware threads share one core\'s pipeline and caches. Your 3750H has 4 cores, 8 threads.');
d('ipc','IPC','Instructions retired per cycle.');
d('mab','MAB / MSHR','Miss address buffer (AMD) / miss status holding register: one entry per outstanding cache-line miss. Later misses to the same line merge into the existing entry.');

d('line','cache line','The 64-byte unit every cache level stores and transfers.');
d('set','set','The group of lines an address\'s index bits select. An address can live only in its own set.');
d('way','way','One slot within a set. An 8-way cache has 8 places per set for any given index.');
d('tag','tag','The upper address bits stored with a line so a lookup can confirm which memory block occupies that slot.');
d('index','index','The address bits that select a set.');
d('offset','offset','The low 6 address bits that select a byte within a 64-byte line.');
d('hit','hit','The requested line is present in that cache level.');
d('miss','miss','The requested line is not present; the request goes to the next level.');
d('valid','valid bit','Marks whether a way holds a real line. A tag match counts only if valid = 1.');
d('dirty','dirty bit','Marks that a line was written after it was filled, so the next level holds a stale copy.');
d('wbk','write-back','A write updates only the cache line and sets its dirty bit; the next level is updated only when the line is evicted.');
d('wthru','write-through','Every write is also sent to the next level immediately.');
d('walloc','write-allocate','On a write miss, the line is first fetched into the cache, then written.');
d('rfo','RFO','Read for ownership: fetching a line with exclusive permission because the core intends to write it. Other cached copies are invalidated.');
d('evict','eviction','Removing a line from a full set to make room. A dirty victim must be written back first.');
d('plru','pseudo-LRU','A cheap approximation of least-recently-used replacement: a small binary tree of bits per set that points toward the older half at each level.');
d('vipt','VIPT','Virtually indexed, physically tagged: the L1 set is chosen with virtual-address bits while the TLB translates in parallel; the tag compare uses the physical address. Works because bits 11:6 are inside the 4 KB page offset and never change in translation.');
d('incl','inclusive cache','A cache that holds a copy of every line held by the smaller caches above it. Zen+\'s L2 is inclusive of its L1s.');

d('ccx','CCX','Core complex: a group of up to four Zen cores sharing one L3. Your 3750H has one CCX with 4 MB of L3.');
d('mlp','memory-level parallelism','Having several cache misses outstanding at once so their latencies overlap. Zen/Zen+ allow 50 outstanding L2-to-L3 misses per core and 96 L3-to-memory misses.');
d('ltu','load-to-use latency','Cycles from a load issuing to the first cycle a dependent instruction can use its value.');

d('dramcell','DRAM cell','One transistor plus one capacitor per bit (1T1C). Dense and cheap, but reading drains the capacitor and charge leaks, so rows need restoring and periodic refresh.');

d('pa','physical address','The address actually sent to caches and DRAM after translation.');
d('page','page','The unit of translation: 4 KB by default, also 2 MB and 1 GB huge pages.');
d('vpn','VPN','Virtual page number: the virtual address with its page-offset bits removed.');
d('pfn','PFN','Page frame number: the physical page number a VPN maps to.');
d('mmu','MMU','Memory management unit: the TLBs, page walkers and permission checks that turn virtual addresses into physical ones.');
d('tlb','TLB','Translation lookaside buffer: a cache of recent VPN-to-PFN translations plus permission bits.');
d('dtlb','DTLB','Data TLB. Zen+: 64-entry fully associative L1 DTLB (all page sizes) backed by a 1536-entry L2 TLB (no 1 GB pages).');

d('reach','TLB reach','How much memory the TLB can map at once: entries × page size. 64 × 4 KB = 256 KB for the L1 DTLB.');

/* --- memory types, stores, ordering --- */
d('memtype','memory type','How the caches treat an address range: WB (write-back, normal RAM), WT (write-through), WC (write-combining), UC (uncacheable), WP (write-protect). Set by PAT bits in page tables and by MTRRs.');
d('pat','PAT / MTRR','Page attribute table (per-page memory type via PTE bits) and memory type range registers (per physical range). Together they decide the memory type.');
d('wc','write-combining','Stores to WC memory are gathered in a WC buffer and sent out as one full-line write, without reading the line first and without caching it.');
d('nt','non-temporal store','A store hint (movnti, movntdq) that uses write-combining even on WB memory, avoiding the RFO and not polluting the caches.');
d('clflush','clflush / clwb','Instructions that write a line back to memory (clwb keeps it cached; clflush/clflushopt also evict it).');
d('fence','sfence / lfence / mfence','Ordering instructions. mfence waits for the store buffer to drain before later loads run \u2014 tens of cycles, easy to measure with a tight loop of mfence alone.');
d('tso','x86-TSO','x86\'s memory model: every ordering is preserved except a store followed by a load to a different address, which the store buffer can reorder.');
/* --- coherence --- */
d('coh','cache coherence','The guarantee that all cores observe a single order of writes to each address, even though each core has private caches.');
d('moesi','MOESI','AMD\'s coherence states: Modified, Owned, Exclusive, Shared, Invalid.');
d('st_m','M (Modified)','Only this cache has the line and it is dirty. It may be read and written without asking anyone.');
d('st_o','O (Owned)','This cache has a dirty copy and other caches share it. The owner answers requests with data; memory is stale.');
d('st_e','E (Exclusive)','Only this cache has the line and it is clean. A write upgrades it to M silently.');
d('st_s','S (Shared)','Several caches may hold this clean (or owner-backed) copy. A write first needs the others invalidated.');
d('st_i','I (Invalid)','The line is not usable in this cache.');
d('probe','probe / snoop','A coherence message asking another cache to return, downgrade, or invalidate its copy of a line.');
d('fshare','false sharing','Two cores writing different variables that share one 64-byte line. Each write invalidates the other core\'s copy, so the line bounces between them.');
/* --- prefetch --- */
d('pref','hardware prefetcher','Logic that watches the stream of miss/access addresses and fetches lines it predicts will be needed, before the program asks.');
d('stream','stream prefetcher','Detects accesses to consecutive lines in one direction and runs ahead along them.');
d('stride','stride prefetcher','Detects a constant distance between successive accesses from the same instruction and fetches ahead by that stride.');
d('swpf','software prefetch','Instructions (prefetcht0/t1/t2/nta) that ask the hardware to start fetching a line without waiting for the data.');
d('late','late prefetch','A prefetch that was issued but whose data had not arrived when the demand access came; the access still waits, but less.');
d('pollute','cache pollution','Useless prefetched lines evicting useful ones.');
d('memwall','memory wall','The widening gap between CPU speed and DRAM latency. The reason the whole hierarchy exists.');
})();

  var stp = App.stepper(root, {render: draw});
  var F = [];
  function f(p, t, d, st){ st.p = p; st.t = t; st.d = d; F.push(st); }
  f('command', 'The driver writes a command into the submission queue', 'The application\u2019s io_uring read request reaches the NVMe driver (<code>nvme_queue_rq()</code>), which fills slot 3 of I/O submission queue 1 with a 64-byte Read command: opcode 0x02, command ID 17, namespace 1, starting LBA 0x123400, 8 blocks of 512 B, and PRP1 = the ' + g('iova') + ' of the 4 KB buffer. These are ordinary stores to write-back memory, so the command sits in core 0\u2019s L1d as a dirty line; DRAM does not have it yet.', {cl: [['SQ slot 3: dirty (M)', 'a1b'], ['CQ slot 3: not cached', 'sunk'], ['buffer: not cached', 'sunk']], sq: 3, sqTail: 4, cqPh: 0, buf: 0, ar: ['core_dram'], hl: ['core'], ct: ['idle'], db: [3, 3]});
  f('doorbell', 'Ring the doorbell: one MMIO store', 'The driver writes the new tail (4) to the SQ1 tail doorbell at BAR0 + 0x1008 with <code>writel()</code>. That page is mapped UC, so the store is not cached or merged; it leaves the core as-is. x86 keeps stores in order, so it cannot become visible before the command stores above it. On weakly ordered CPUs <code>writel()</code> adds a barrier to give the same guarantee.', {cl: [['SQ slot 3: dirty (M)', 'a1b'], ['CQ slot 3: not cached', 'sunk'], ['buffer: not cached', 'sunk']], sq: 3, sqTail: 4, buf: 0, ar: ['core_hub'], hl: ['core', 'hub'], ct: ['idle'], db: [3, 3]});

  f('fetch', 'The SSD fetches the command by DMA', 'The SSD sends a Memory Read TLP (non-posted: it expects a completion) for the 64 bytes at the IOVA of slot 3. The ' + g('iommu') + ' translates that IOVA to a physical address through its IOTLB, walking its own page tables on a miss, and rejects addresses the OS never mapped for this device. The fabric then performs a coherent read: core 0\u2019s L1d holds the line dirty, so it is probed and supplies the data (' + g('iocoh') + '). The command travels back in a Completion-with-Data TLP.', {cl: [['SQ slot 3: supplied to device', 'okb'], ['CQ slot 3: not cached', 'sunk'], ['buffer: not cached', 'sunk']], sq: 3, sqTail: 4, sqHead: 4, buf: 0, ar: ['ssd_link', 'link_hub', 'hub_fab', 'fab_core', 'hub_link', 'link_ssd'], hl: ['hub', 'fab', 'core', 'link'], tlp: ['\u2190 MRd 64 B', 'slot 3 IOVA', 'CplD 64 B \u2192', 'command'], iommu: ['IOVA \u2192 PA', 'IOTLB lookup'], ct: ['command fetched: Read, 8 \u00d7 512 B', 'CID 17, PRP1 = buffer IOVA'], db: [4, 3]});
  f('flash', 'The SSD reads flash', 'The controller maps LBA 0x123400 to a NAND location and reads it. This is the slow part: tens of microseconds is typical for a NAND read, thousands of times a DRAM access. It is a typical figure, not a measurement; <code>fio</code> measures your drive.', {cl: [['SQ slot 3: clean copy', 'sunk'], ['CQ slot 3: not cached', 'sunk'], ['buffer: not cached', 'sunk']], sq: 3, sqTail: 4, sqHead: 4, buf: 0, ar: [], hl: ['ssd'], ct: ['reading NAND', 'LBA 0x123400, 4 KB'], nand: 1, db: [4, 3]});
  f('data', 'DMA the data into the buffer', 'The SSD writes 4096 bytes with posted Memory Write TLPs, each at most Max_Payload_Size bytes (256 B shown: 16 TLPs; <code>lspci -vv</code> shows your value). Each is translated by the IOMMU. The fabric writes the lines to DRAM and invalidates any copies of them in the CPU caches, so no core can later read a stale line.', {cl: [['SQ slot 3: clean copy', 'sunk'], ['CQ slot 3: not cached', 'sunk'], ['buffer: copies invalidated', 'badb']], sq: 3, sqTail: 4, sqHead: 4, buf: 64, ar: ['ssd_link', 'link_hub', 'hub_fab', 'fab_dram'], hl: ['hub', 'fab', 'dram', 'link'], tlp: ['\u2190 MWr 256 B', '\u00d7 16', 'data'], iommu: ['IOVA \u2192 PA', 'per TLP'], ct: ['DMA write 4 KB'], db: [4, 3]});
  f('CQE', 'Post the completion entry', 'The SSD writes a 16-byte completion into CQ1 slot 3: status success, SQ head = 4, command ID 17, and the phase bit set to 1. The phase bit flips on every pass around the ring, so the driver can tell a new entry from an old one without a separate counter. PCIe keeps posted writes in order: the data is in memory before this entry is.', {cl: [['SQ slot 3: clean copy', 'sunk'], ['CQ slot 3: invalidated', 'badb'], ['buffer: copies invalidated', 'badb']], sq: 3, sqTail: 4, sqHead: 4, buf: 64, cqe: 1, ar: ['ssd_link', 'link_hub', 'hub_fab', 'fab_dram'], hl: ['dram', 'link'], tlp: ['\u2190 MWr 16 B', 'CQ1 slot 3', 'phase = 1'], ct: ['completion posted'], db: [4, 3]});
  f('MSI-X', 'Interrupt: another memory write', 'The SSD raises ' + g('msix') + ': one more posted write, a 32-bit message to an address in the 0xFEE0_0000 range. The IOMMU\u2019s interrupt remapping checks and routes it to core 0\u2019s local APIC, and the core enters <code>nvme_irq()</code>. With polled I/O (<code>IORING_SETUP_IOPOLL</code>) there is no interrupt: the driver polls the completion queue instead.', {cl: [['SQ slot 3: clean copy', 'sunk'], ['CQ slot 3: invalidated', 'badb'], ['buffer: copies invalidated', 'badb']], sq: 3, sqTail: 4, sqHead: 4, buf: 64, cqe: 1, ar: ['ssd_link', 'link_hub', 'hub_irq'], hl: ['hub', 'core', 'link'], tlp: ['\u2190 MWr 4 B', '0xFEE0_xxxx', 'interrupt'], ct: ['MSI-X vector sent'], db: [4, 3]});
  f('consume', 'The driver consumes the completion', 'The driver reads CQ1 slot 3. The DMA write invalidated that line, so the load misses and reads DRAM. The phase bit matches the value expected on this pass: new entry. The request completes and io_uring posts a completion to the application\u2019s ring. The driver writes CQ1 head = 4 to the doorbell at BAR0 + 0x100C so the SSD may reuse the slot.', {cl: [['SQ slot 3: clean copy', 'sunk'], ['CQ slot 3: read from DRAM', 'a4b'], ['buffer: copies invalidated', 'badb']], sq: 3, sqTail: 4, sqHead: 4, buf: 64, cqe: 1, cqHead: 4, ar: ['fab_dram', 'fab_core', 'core_hub', 'hub_link', 'link_ssd'], hl: ['core', 'dram'], tlp: ['MWr 4 B \u2192', 'CQ1 head = 4'], ct: ['CQ1 head 3 \u2192 4'], db: [4, 4]});

    E.io.setAttribute('class', fr.iommu ? 'on box' : 'box'); E.rc.setAttribute('class', fr.hl.indexOf('hub') >= 0 && !fr.iommu && fr.p !== 'MSI-X' ? 'on box' : 'box');
    E.ic.setAttribute('class', fr.p === 'MSI-X' ? 'on box' : 'box'); E.nand.setAttribute('class', fr.nand ? 'on box' : 'box'); E.ctl.setAttribute('class', fr.ct[0] !== 'idle' ? 'on box' : 'box');
    E.tlp.forEach(function(t, k){ t.textContent = (fr.tlp || [])[k] || ''; });
    ['core', 'fab', 'dram', 'hub', 'link', 'ssd'].forEach(function(id){ E[id].setAttribute('class', fr.hl.indexOf(id) >= 0 && id !== 'hub' && id !== 'ssd' ? 'on' : ''); });
    for (var id in AR){ var on = fr.ar.indexOf(id) >= 0; AR[id].style.opacity = on ? 1 : .12; AR[id].setAttribute('class', 'wire' + (on ? ' on flow' : '')); }
  }
  stp.set(F);
  var cards = h('div', {'class': 'grid2'}, root);
  h('div', {'class': 'card'}, cards, '<h3>Where each chapter showed up</h3><table class="mt"><tr><th>step</th><th>mechanism</th><th>chapter</th></tr>' +
    [['command in SQ', 'WB stores, dirty line in L1d', '04, 07'], ['doorbell', 'UC memory type, store ordering', '07'], ['command fetch', 'IOMMU walk, coherent read of a dirty line', '03, 08'], ['data DMA', 'writes to DRAM, cached copies invalidated', '06, 08'], ['completion read', 'miss to DRAM after invalidation', '05']]

  h('div', {'class': 'card'}, cards, '<h3>The same ring, one level up</h3><p>io_uring puts a submission ring and a completion ring in memory shared by the application and the kernel. Head and tail indices are published with store-release and read with load-acquire (the <code>smp_store_release()</code> / <code>smp_load_acquire()</code> pair from Chapter 07), exactly the ordering the NVMe ring needs between driver and device. Kernel function names above are from recent mainline and move between versions.</p>');

    var lat = o.lvl === 'L1' ? CFG.l1 : o.lvl === 'L2' ? CFG.l2 : o.lvl === 'L3' ? CFG.l3 : App.dramCycles();
    add('load hist[123]: ' + {L1: 'L1d hit', L2: 'L1 miss, L2 hit', L3: 'L2 miss, L3 hit', DRAM: 'miss to DRAM'}[o.lvl], lat, 'published', o.lvl === 'L1' ? 'l1d' : o.lvl === 'DRAM' ? 'dram' : 'hier', o.lvl === 'DRAM' ? 'L3 ' + CFG.l3 + ' cycles + ' + CFG.dramNs + ' ns (latency settings)' : 'load-to-use');
    if (o.lvl === 'DRAM' && o.row !== 'closed') add(o.row === 'hit' ? 'row already open: saves ACT' : 'row conflict: extra PRE', (o.row === 'hit' ? -14.2 : 14.2) * ghz, 'derived', 'dram', 'device-time difference from Chapter 06 (\u00b1 14.2 ns)');
    add('add: tmp + 1', 1, 'published', 'core', '1-cycle ALU op');
    add('store address + data into the SQ', 2, 'model', 'core', 'STA / STD');
    add('retire (older instructions already done)', 1, 'model', 'core', 'ROB head');
    add('commit to L1d: line is E after the load, becomes M', 1, 'model', 'stores', 'no RFO needed');
    S.forEach(function(x){ if (x.n.indexOf('row already open') === 0) x.neg = true; });
    return S;
  }
  var COL = {core: 'a3b', xlate: 'a4b', l1d: 'a2b', hier: 'a2b', dram: 'a1b', stores: 'a3b'};
  function draw(){
    var S = steps(), ghz = CFG.ghz, tot = 0;
    S.forEach(function(x){ tot += x.neg ? -x.c : x.c; });
    sv.innerHTML = ''; var x0 = 10, W = 980, acc = 0;
    s('text', {x: 10, y: 16, 'class': 'h'}, sv, 'Critical path: ' + tot + ' cycles = ' + (tot / ghz).toFixed(1) + ' ns at ' + ghz + ' GHz');
    S.forEach(function(x){
      if (x.neg) return;
      var w = (x.c / (tot + (S.filter(function(y){ return y.neg; }).reduce(function(a, y){ return a + y.c; }, 0)))) * W;
      s('rect', {x: x0 + acc, y: 28, width: Math.max(1.5, w), height: 40, 'class': COL[x.ch] || 'box'}, sv); acc += w;
    });
    var mem = S.filter(function(x){ return /load hist|page walk|row/.test(x.n); }).reduce(function(a, x){ return a + (x.neg ? -x.c : x.c); }, 0);
    s('text', {x: 10, y: 92, 'font-size': 13}, sv, 'Time spent waiting for translation and data: ' + Math.round(100 * mem / tot) + '%. Everything else together: ' + (tot - mem) + ' cycles.');
    s('text', {x: 10, y: 112, 'class': 's'}, sv, 'Bar widths are proportional to time; tiny segments are the pipeline stages.');
    var cum = 0;
    tbl.innerHTML = '<h3>Step by step</h3><div style="overflow-x:auto"><table class="mt" style="min-width:560px"><tr><th>step</th><th>cycles</th><th>ns</th><th>total</th><th>source</th><th></th></tr>' + S.map(function(x){
      cum += x.neg ? -x.c : x.c;
      return '<tr><td style="font-family:var(--sans)">' + x.n + '<div class="note">' + x.what + '</div></td><td>' + (x.neg ? '\u2212' : '') + x.c + '</td><td>' + (x.c / ghz).toFixed(1) + '</td><td>' + cum + '</td><td><span class="tag ' + (x.src === 'published' ? 'pub' : x.src === 'model' ? '' : 'act') + '">' + x.src + '</span></td><td><button class="lnk" data-ch="' + x.ch + '">chapter \u2192</button></td></tr>';
    }).join('') + '</table></div><p class="note" style="margin-top:8px"><b>published</b>: Zen/Zen+ figures from the latency settings (replace them with your own measured plateaus). <b>model</b>: the stage counts of the Chapter 02 model, not measured. <b>assumed</b> / <b>derived</b>: stated in the step.</p>';
    tbl.querySelectorAll('button.lnk').forEach(function(b){ b.onclick = function(){ App.go(b.dataset.ch); }; });
    sum.innerHTML = '<h3>After this instruction</h3><p>The line holding hist[123] is now Modified in core 0\u2019s L1d; DRAM is stale (Chapters 07, 08). Nothing else happens to it until it is evicted, when its 64 bytes are written back to the L2, later enter the L3 as a victim, and eventually reach DRAM through the controller as a write (Chapters 04\u201306). That write-back is off the critical path of this instruction; the core keeps running.</p><p>For comparison: at ' + ghz + ' GHz the loop body runs about one iteration per cycle when everything hits (Chapter 02). A single miss to DRAM costs the time of hundreds of iterations, which is why the hierarchy, the prefetchers and memory-level parallelism exist.</p>';
  }
  App.onCfg(draw);
  draw();
}});

/* ======================= chapter: glossary ======================= */
App.chapter({id: 'gloss', num: '12', short: 'Glossary', title: 'Glossary',
sub: 'Every term used in these chapters, the same definitions the dotted terms open.',
build: function(root){
  var h = App.h;
  var bar = h('div', {'class': 'stp'}, root);
  var q = h('input', {type: 'search', placeholder: 'filter terms\u2026', style: 'flex:1;max-width:420px', 'aria-label': 'filter glossary'}, bar);
  var cnt = h('span', {'class': 'note'}, bar);
  var list = h('div', {'class': 'glist'}, root);
  var keys = Object.keys(App.G).sort(function(a, b){ return App.G[a].t.toLowerCase().localeCompare(App.G[b].t.toLowerCase()); });
  function draw(){
    var f = q.value.trim().toLowerCase(), n = 0;
    list.innerHTML = keys.filter(function(k){ var e = App.G[k]; return !f || e.t.toLowerCase().indexOf(f) >= 0 || e.d.toLowerCase().indexOf(f) >= 0; })
      .map(function(k){ n++; var e = App.G[k]; return '<div class="card"><h3>' + e.t + '</h3><p>' + e.d + '</p></div>'; }).join('');
    cnt.textContent = n + ' of ' + keys.length + ' terms';
  }
  q.oninput = draw; draw();
}});

App.start();
