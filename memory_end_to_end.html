/* ========================================================================== */
/* V6 — capsule terms, sourced definitions, de-collided palette, typography    */
/* ========================================================================== */

/* One palette for term categories. None of them sits on the amber accent,   */
/* which is reserved for "active" in every diagram.                          */
:root{--t-core:#a78bfa;--t-xlate:#60a5fa;--t-cache:#4ade80;--t-memory:#22d3ee;--t-io:#a3e635;--t-order:#fb7185;--t-coh:#e879f9;--t-pref:#fde047}
.term-core{--term:var(--t-core)!important}.term-xlate{--term:var(--t-xlate)!important}.term-cache{--term:var(--t-cache)!important}.term-memory{--term:var(--t-memory)!important}
.term-io{--term:var(--t-io)!important}.term-order{--term:var(--t-order)!important}.term-coh{--term:var(--t-coh)!important}.term-pref{--term:var(--t-pref)!important}

/* ----- capsule terms ----- */
dfn[data-g]{
  --term:#94a3b8;
  display:inline;font-style:normal;font-weight:560;text-decoration:none;cursor:pointer;
  color:color-mix(in srgb,var(--term) 62%,#ffffff);
  background:color-mix(in srgb,var(--term) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--term) 28%,transparent);
  border-radius:999px;padding:.02em .48em .06em;margin:0 .04em;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;box-shadow:none;
  transition:background-color .16s ease,border-color .16s ease,color .16s ease,box-shadow .16s ease;
}
dfn[data-g]:hover,dfn[data-g]:focus-visible,dfn[data-g].term-open{
  color:#fff;outline:none;
  background:color-mix(in srgb,var(--term) 24%,transparent);
  border-color:color-mix(in srgb,var(--term) 72%,transparent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--term) 15%,transparent);
}
.mt dfn[data-g],.note dfn[data-g],small dfn[data-g]{padding:0 .38em .02em;font-weight:530}
dfn[data-g].term-nowrap{white-space:nowrap}
h1 dfn[data-g],h2 dfn[data-g],h3 dfn[data-g],h4 dfn[data-g]{font-weight:inherit}

/* ----- definition popover ----- */
.gloss-pop{
  --term:#94a3b8;
  padding:0!important;overflow:visible!important;border-radius:14px!important;
  background:linear-gradient(180deg,#101822 0%,#0b1017 100%)!important;
  border:1px solid color-mix(in srgb,var(--term) 26%,#263240)!important;
  box-shadow:0 24px 64px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.025) inset!important;
}
.gloss-pop.pop-in{animation:pop-in .2s cubic-bezier(.2,.8,.2,1)}
.gloss-pop[data-side="above"].pop-in{animation-name:pop-in-up}
@keyframes pop-in{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
@keyframes pop-in-up{from{opacity:0;transform:translateY(-6px) scale(.985)}to{opacity:1;transform:none}}
.term-pop-caret{position:absolute;left:var(--caret,24px);top:-7px;width:12px;height:12px;transform:rotate(45deg);background:#101822;
  border-left:1px solid color-mix(in srgb,var(--term) 26%,#263240);border-top:1px solid color-mix(in srgb,var(--term) 26%,#263240)}
.gloss-pop[data-side="above"] .term-pop-caret{top:auto;bottom:-7px;transform:rotate(225deg);background:#0b1017}
.gloss-pop .term-pop-head{display:grid;grid-template-columns:1fr auto;grid-template-areas:"cat close" "title close";align-items:center;gap:6px 10px;padding:14px 14px 10px 16px;border-bottom:1px solid #1c2631;border-radius:14px 14px 0 0}
.gloss-pop .term-pop-head b{grid-area:title;font-size:15.5px!important;font-weight:650;color:#f5f8fb;letter-spacing:-.005em}
.gloss-pop .term-pop-close{grid-area:close;align-self:start;width:28px;min-width:28px;height:28px;min-height:28px;border-radius:999px;font-size:17px;color:#7d8a99}
.gloss-pop .term-pop-close:hover{background:#18212c;color:#fff}
.term-pop-cat{grid-area:cat;justify-self:start;display:inline-flex;align-items:center;gap:6px;font:650 10.5px var(--sans)!important;letter-spacing:.02em!important;text-transform:none!important;
  padding:3px 9px 3px 8px!important;border-radius:999px!important;color:color-mix(in srgb,var(--term) 78%,#fff)!important;
  background:color-mix(in srgb,var(--term) 13%,transparent)!important;border:1px solid color-mix(in srgb,var(--term) 34%,transparent)}
.term-pop-cat::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--term);box-shadow:0 0 8px var(--term)}
.gloss-pop .term-mini{margin:12px 16px 0;padding:8px 10px 2px;border-radius:10px;background:#0c131b;border:1px solid #18222d}
.gloss-pop .term-pop-def{padding:12px 16px 4px!important;margin:0!important;color:#c5ced8!important;font-size:13.4px;line-height:1.62}
.term-pop-foot{display:grid;gap:10px;padding:12px 16px 15px;margin-top:8px;border-top:1px solid #1c2631}
.term-pop-ch{display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:10px;text-decoration:none;font-size:12.5px;color:#9aa6b3;background:#121a24;border:1px solid #222e3b;transition:border-color .15s,background-color .15s}
.term-pop-ch b{color:#eef3f7;font-weight:600}
.term-pop-ch i{margin-left:auto;font-style:normal;color:var(--term);transition:transform .15s}
.term-pop-ch:hover{background:#16202b;border-color:color-mix(in srgb,var(--term) 50%,#222e3b)}
.term-pop-ch:hover i{transform:translateX(3px)}
.term-pop-src{display:grid;gap:5px}
.term-pop-src>span{font:650 10px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:#6f7c8b;margin-bottom:1px}
.term-pop-src a{display:grid;gap:1px;padding:7px 11px;border-radius:10px;text-decoration:none;border:1px solid #1d2833;transition:border-color .15s,background-color .15s}
.term-pop-src a b{font-size:12.6px;font-weight:560;color:#dfe6ee;line-height:1.35}
.term-pop-src a small{font-size:11px;color:#7c8998}
.term-pop-src a:hover{background:#121a24;border-color:color-mix(in srgb,var(--term) 45%,#1d2833)}
.term-pop-src a:hover b{color:#fff}
.term-pop-src a:focus-visible,.term-pop-ch:focus-visible{outline:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--term) 60%,transparent)}

/* ----- typography: no orphaned words in headings, fewer ragged paragraphs ----- */
h1,h2,h3,h4,.narr h4{text-wrap:balance}
p,li,dd{text-wrap:pretty}

/* ----- glossary chapter ----- */
.gl-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.gl-bar input{flex:1;max-width:460px;border-radius:999px;padding:10px 16px;font:14px var(--sans);background:#0d131a;border:1px solid #273340;color:var(--tx)}
.gl-bar input:focus{border-color:#4b5f74;outline:none;box-shadow:0 0 0 3px rgba(96,165,250,.12)}
.gl-chips{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 18px}
.gl-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 10px;border-radius:999px;font:560 12.5px var(--sans);color:#aab5c1;background:#0f151d;border:1px solid #232f3c;cursor:pointer;transition:background-color .15s,border-color .15s,color .15s}
.gl-chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--term,#94a3b8)}
.gl-chip.term-all::before{background:conic-gradient(var(--t-core),var(--t-xlate),var(--t-memory),var(--t-cache),var(--t-io),var(--t-pref),var(--t-order),var(--t-coh),var(--t-core))}
.gl-chip small{font:11px var(--mono);color:#6f7c8b}
.gl-chip:hover{border-color:color-mix(in srgb,var(--term,#94a3b8) 55%,#232f3c);color:#fff}
.gl-chip.on{color:#fff;background:color-mix(in srgb,var(--term,#94a3b8) 16%,#0f151d);border-color:color-mix(in srgb,var(--term,#94a3b8) 70%,transparent)}
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.gl-card{--term:#94a3b8;display:flex;flex-direction:column;gap:8px;padding:16px 16px 14px!important;border-radius:14px!important;border-top:2px solid color-mix(in srgb,var(--term) 60%,transparent)!important}
.gl-card h3{margin:2px 0 0!important;font-size:16px!important}
.gl-card>p{margin:0!important;font-size:13.6px!important;line-height:1.6}
.gl-card .term-pop-cat{align-self:flex-start}
.gl-card .term-pop-foot{margin-top:auto;padding:12px 0 0;border-top:1px solid #1c2631}
.gl-empty{padding:30px;text-align:center;color:var(--tx3)}

@media (prefers-reduced-motion:reduce){
  .gloss-pop.pop-in{animation:none}
  dfn[data-g],.term-pop-ch,.term-pop-ch i,.term-pop-src a,.gl-chip{transition:none}
}

/* ==========================================================================
   V7: long-scroll chapters, section menu, chapter ledes, Foundations layout
   ========================================================================== */
:root{--t-basics:#cbd5e1}
.term-basics{--term:var(--t-basics)!important}

/* ---- chapter header: one lede, then separate points ---- */
.chh .ch-lede{margin:0 0 14px;max-width:760px}
.ch-points{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-width:760px}
.ch-points li{position:relative;padding-left:20px;color:var(--tx2);font-size:15px;line-height:1.55}
.ch-points li::before{content:"";position:absolute;left:3px;top:.6em;width:7px;height:7px;border-radius:2px;background:var(--act);opacity:.85}

/* ---- long scroll: every section present; no guided bar, no Continue buttons ---- */
.learning-journey,.scene-nav{display:none!important}
.long-scroll .learning-scene{display:block!important;margin-top:64px;animation:none}
.long-scroll .chapter-body>.learning-scene:first-child{margin-top:12px}
.learning-scene{scroll-margin-top:76px}
.long-scroll .scene-lead{margin-bottom:22px}
.scene-kicker{font:700 12px var(--mono);letter-spacing:.08em;color:var(--act)}
div.concept-disclosure{border:0!important;background:none!important;padding:0!important;margin:0!important;box-shadow:none!important}

/* ---- top bar: current section + section menu + reading progress ---- */
.crumb{min-width:0}
.crumb-sec{display:inline-flex;align-items:center;gap:6px;min-width:0;max-width:min(40vw,380px);height:30px;margin-left:4px;padding:0 10px;border-radius:8px;border:1px solid var(--bd);background:transparent;color:var(--tx2);font-size:12.5px;cursor:pointer}
.crumb-sec:hover,.crumb-sec[aria-expanded="true"]{border-color:var(--bd2);color:var(--tx)}
.crumb-sec #crumbSecTitle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb-sec .crumb-sep{color:var(--tx3)}
.crumb-sec i{font-style:normal;color:var(--tx3);font-size:10px}
.crumb-sec[hidden]{display:none}
.sec-menu{position:absolute;left:clamp(12px,5vw,84px);top:calc(100% + 6px);z-index:60;min-width:260px;max-width:min(92vw,420px);max-height:min(70vh,520px);overflow:auto;padding:6px;border-radius:12px;border:1px solid var(--bd2);background:var(--panel);box-shadow:0 18px 50px rgba(0,0,0,.35)}
.sec-menu[hidden]{display:none}
.sec-item{display:flex;gap:12px;align-items:baseline;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:8px;color:var(--tx2);font-size:13.5px;cursor:pointer}
.sec-item b{font:600 11px var(--mono);color:var(--tx3)}
.sec-item:hover{background:var(--sunk);color:var(--tx)}
.sec-item.cur{background:var(--actbg);color:var(--act)}
.sec-item.cur b{color:var(--act)}
.read-progress{position:absolute;left:0;right:0;bottom:-1px;height:2px;pointer-events:none}
.read-progress i{display:block;height:100%;background:var(--act);transform-origin:0 50%;transform:scaleX(0)}
@media (max-width:640px){
  .crumb:has(.crumb-sec:not([hidden])) .crumb-title{display:none}
  .crumb-sec{max-width:58vw}
}

/* ---- lists that used to be run-on sentences ---- */
.narr ul,.p-list,.note-list,.kv-list{margin:8px 0 0;padding-left:20px}
.narr ul li,.p-list li,.note-list li,.kv-list li{margin:5px 0;line-height:1.6}
.narr p+ul,.narr ul+p{margin-top:8px}
ul.note{font-size:12.5px;color:var(--tx3)}
.kv-list{list-style:none;padding-left:0}
.kv-list li{font-family:var(--mono);font-size:13px}
.mcap p+p{margin-top:8px}
.asm-key{margin-top:6px!important;line-height:2.1}
.asm-key b{margin-right:6px;color:var(--tx2)}

/* ---- auto-linked terms: registers and mnemonics inside code, hex values ---- */
dfn.term-code{padding:0!important;border:0!important;background:none!important;box-shadow:none!important;border-radius:0!important;color:inherit!important;font:inherit!important;text-decoration:underline dotted color-mix(in srgb,var(--term) 80%,transparent);text-decoration-thickness:1.5px;text-underline-offset:3px}
dfn.term-code:hover,dfn.term-code:focus-visible,dfn.term-code.term-open{color:var(--term)!important;text-decoration-style:solid}
dfn.term-hex{font-family:var(--mono);font-size:.92em}
.term-pop-val{margin:0;padding:10px 14px 0;font-size:12.5px;color:#aeb9c5;line-height:1.7}
.term-pop-val code{font-size:12px}
a.ch-ref{color:var(--act);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--act) 40%,transparent)}
a.ch-ref:hover{border-bottom-color:var(--act)}

/* ---- Foundations: text next to a small figure ---- */
.p-sec{min-width:0}
.p-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,480px);gap:32px;align-items:start}
.p-row+.p-row{margin-top:28px}
.p-row.p-row-text{grid-template-columns:minmax(0,1fr)}
.p-text{min-width:0;max-width:72ch}
.p-row-text>.p-text{max-width:none}
.p-row-text>.p-text>p,.p-row-text>.p-text>.p-list{max-width:72ch}
.p-text>p{margin:0 0 12px;font-size:15.5px;line-height:1.7;color:var(--tx2)}
.p-text>p:last-child{margin-bottom:0}
.p-text b{color:var(--tx)}
.p-text code{font-size:.88em;background:var(--sunk);border:1px solid var(--bd);border-radius:5px;padding:1px 5px}
.p-text .p-list{margin:4px 0 12px}
.p-text .p-list li{font-size:15px;color:var(--tx2)}
.p-code{margin:6px 0 14px;padding:14px 16px;border-radius:10px;border:1px solid var(--bd);background:var(--sunk);overflow-x:auto}
.p-code code{background:none!important;border:0!important;padding:0!important;font:13px/1.6 var(--mono)!important;color:var(--tx);white-space:pre}
.p-fig{margin:0;padding:14px 14px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--panel)}
.p-fig svg{display:block;width:100%;height:auto}
.p-fig svg text{font-size:13px}
.p-fig svg .s{font-size:11.5px}
.p-fig svg .h{font-size:14px}
.p-fig figcaption{margin-top:10px;font-size:12.5px;line-height:1.5;color:var(--tx3)}
.p-table-wrap{overflow-x:auto;margin:6px 0 14px}
.p-table{width:100%;border-collapse:collapse;font-size:13.5px}
.p-table th,.p-table td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top;color:var(--tx2)}
.p-table th{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--tx3)}
.p-table td:first-child{font-family:var(--mono);color:var(--tx3);white-space:nowrap}
.p-table td:nth-child(2){white-space:nowrap}
@media (max-width:980px){.p-row{grid-template-columns:minmax(0,1fr);gap:16px}.p-fig{max-width:560px}}

/* ---- Start page ---- */
.path-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:980px}
.path-card{display:flex;flex-direction:column;gap:6px;padding:18px 18px 16px;border-radius:12px;border:1px solid var(--bd2);background:var(--panel);color:var(--tx);text-decoration:none;transition:border-color .15s,transform .15s}
.path-card:hover{border-color:var(--act);transform:translateY(-1px)}
.path-k{font:700 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--act)}
.path-card strong{font-size:18px}
.path-card span:last-child{color:var(--tx2);font-size:14px;line-height:1.55}
@media (max-width:720px){.path-cards{grid-template-columns:1fr}}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.legend-chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;border:1px solid color-mix(in srgb,var(--term) 45%,transparent);background:color-mix(in srgb,var(--term) 13%,transparent);color:color-mix(in srgb,var(--term) 80%,var(--tx))}

/* ---- desktop keeps the top bar: chapter, current section, section menu, reading progress ---- */
@media (min-width:901px){
  :root{--topbar-h:52px}
  .top{display:block}
  .top .nav-toggle{display:none}
  .topin{padding-left:28px}
}
.map-inspector{top:calc(var(--topbar-h) + 20px)}
.glossary-workspace>.stp{top:calc(var(--topbar-h) + 12px)}

/* ---- overview figures under section headings (hardware chapters) ---- */
.sec-figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),520px));gap:16px;margin:0 0 30px}
.sec-figs .p-fig{margin:0}

/* Phase 1: use the existing palette, typography and long-scroll chapter rhythm. */
[hidden]{display:none!important}
:root .ch.long-scroll .learning-scene[hidden]{display:none!important}
.evidence-contract,.prediction,.perf-explanation{border-left:3px solid var(--act);padding:14px 20px;background:var(--panel);border-radius:0 8px 8px 0}
.evidence-label{display:inline-block;font:650 10px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--act);padding:5px 8px;border:1px solid var(--bd2);border-radius:4px;margin-bottom:10px}
.ch-perf .p-sec>p,.stream-lab>p,.e2e-critical>p{max-width:86ch;color:var(--tx2);line-height:1.7}
.perf-controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}
.perf-field{display:flex;flex-direction:column;gap:7px;font-size:12px;color:var(--tx2);min-width:0}
.perf-field select,.perf-field input{width:100%;min-width:0;min-height:40px;padding:8px;background:var(--sunk);color:var(--tx);border:1px solid var(--bd2);border-radius:6px}
.perf-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0}
.perf-actions button[aria-pressed="true"]{background:var(--actbg);border-color:var(--act);color:var(--act)}
.perf-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px;margin:22px 0}
.perf-metric{padding:16px;border:1px solid var(--bd2);border-radius:8px;background:var(--panel);display:grid;gap:6px;align-content:start}
.perf-metric>span{font:600 11px var(--mono);color:var(--tx2)}
.perf-metric strong{font:650 clamp(19px,2.6vw,27px) var(--mono);color:var(--act);white-space:nowrap}
.perf-metric small{font-size:11.5px;line-height:1.5;color:var(--tx2)}
.perf-table-wrap{max-width:100%;overflow:auto;margin:18px 0;border:1px solid var(--bd);border-radius:7px}
.perf-table-wrap .p-table{margin:0;min-width:560px}
.perf-table-wrap .p-table td{white-space:normal;font-family:var(--sans);color:var(--tx2);line-height:1.55;min-width:90px}
.perf-table-wrap .p-table td:first-child{color:var(--tx);font-size:12px;min-width:130px}
.perf-table-wrap .p-table td:nth-child(2){white-space:normal}
.perf-table-wrap .p-table th{padding:10px;color:var(--tx2);background:var(--sunk)}
.perf-chart{margin:22px 0;padding:16px;background:var(--panel);border:1px solid var(--bd2);border-radius:8px;overflow:auto}

<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
    <a class="sidebar-brand" href="#map" aria-label="Memory system home">
      <span class="sidebar-mark">MEM</span>
      <span><strong>Memory systems lab</strong><small>interactive hardware atlas · Zen+</small></span>
    </a>
    <div class="sidebar-scroll">
      <nav class="nav" id="nav" aria-label="Chapters"></nav>
    </div>
    <div class="sidebar-footer">
      <div class="machine-meta">Ryzen 7 3750H · 4C / 8T<br>interactive model + measured inputs</div>
      <div class="side-actions">
        <button class="ghost side-pin" id="sidebarPin" type="button" aria-pressed="false" title="Keep navigation expanded"><span class="pin-glyph" aria-hidden="true">⌖</span><span class="action-label">pin rail</span></button>
        <button class="ghost" data-open-cfg type="button" title="Latency model"><span class="latency-glyph" aria-hidden="true">≋</span><span class="action-label">latencies</span></button>
      </div>
    </div>
  </aside>
  <div class="side-scrim" id="sideScrim"></div>

  <div class="app-stage">
    <header class="top">
      <div class="topin">
        <button class="iconbtn nav-toggle" id="navToggle" type="button" aria-label="Open chapter navigation" aria-expanded="false">☰</button>
        <div class="crumb" aria-live="polite">
          <span class="crumb-num" id="crumbNum">00</span>
          <span class="crumb-title" id="crumbTitle">The machine</span>
          <button class="crumb-sec" id="crumbSec" type="button" aria-expanded="false" aria-controls="secMenu" hidden><span id="crumbSecTitle"></span><i aria-hidden="true">▾</i></button>
        </div>
        <span class="top-spacer"></span>
        <div class="top-actions">
          <button class="iconbtn" id="themeToggle" type="button" aria-label="Switch to light theme">☀</button>
          <button class="iconbtn mobile-only" data-open-cfg type="button" aria-label="Open latency model" title="Latency model">≋</button>
        </div>
      </div>
      <div class="sec-menu" id="secMenu" role="menu" hidden></div>
      <div class="read-progress"><i id="readProg"></i></div>
    </header>

    <main class="wrap" id="main"></main>
  </div>
</div>

<div class="pop" id="pop" role="dialog" aria-live="polite"></div>
<div class="drawer" id="cfg"><div class="in" id="cfgIn"></div></div>
<script>
/* ======================= core ======================= */
var App = (function(){
  var NS = 'http://www.w3.org/2000/svg';
  function s(tag, attrs, parent, text){
    var e = document.createElementNS(NS, tag);
    if (attrs) for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }
  function h(tag, attrs, parent, html){
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs){
      if (k === 'class') e.className = attrs[k];
      else if (k === 'style' && typeof attrs[k] === 'object') for (var sk in attrs[k]) e.style[sk] = attrs[k][sk];
      else e.setAttribute(k, attrs[k]);
    }
    if (html !== undefined) e.innerHTML = html;
    if (parent) parent.appendChild(e);
    return e;
  }
  function hx(v, w){ var t = (typeof v === 'bigint' ? v : BigInt(v)).toString(16); if (w) t = t.padStart(w, '0'); return '0x' + t; }
  function hb(v){ return v.toString(16).padStart(2, '0'); }

  /* ---------- the running example: one program, one set of addresses ---------- */
  var EX = {
    fn: 0x555555555180n, loop: 0x555555555190n, ret: 0x5555555551a1n,
    data: 0x55555555a2c0n, hist: 0x7ffd4a3c2a80n, rsp: 0x7ffd4a3c2a58n, retAddr: 0x5555555552d4n,
    n: 3, bytes: [123, 123, 7, 46, 200, 123], histInit: {123: 41, 7: 9, 46: 3, 200: 17},
    /* VA page -> PFN, fixed for every chapter */
    pages: { '555555555': 0x2b4e1n, '55555555a': 0x1c07an, '7ffd4a3c2': 0x1a3f7cn, '7ffd4a3c3': 0x0f9d2n },
    cr3: 0x10a3b000n
  };
  EX.histAddr = function(k){ return EX.hist + BigInt(k) * 8n; };
  EX.pa = function(va){
    var vpn = (va >> 12n).toString(16), pfn = EX.pages[vpn];
    return pfn === undefined ? null : (pfn << 12n) | (va & 0xfffn);
  };

  /* ---------- representative unloaded inputs, not a measured 3750H calibration ---------- */
  var CFG = { ghz: 4.0, l1: 4, l2: 12, l3: 35, dramNs: 90, tscGhz: 2.297 };
  var CFG_DEF = JSON.parse(JSON.stringify(CFG));
  function validCfg(k,v){return Object.prototype.hasOwnProperty.call(CFG_DEF,k) && Number.isFinite(v) && v >= (k==='ghz'||k==='tscGhz'?.1:1) && v <= (k==='ghz'||k==='tscGhz'?10:500);}
  try { var sv = localStorage.getItem('memE2E.cfg'); if (sv){ var o = JSON.parse(sv); for (var k in o) if (validCfg(k,+o[k])) CFG[k] = +o[k]; } } catch(e){}
  var cfgListeners = [];
  function dramCycles(){ return Math.round(CFG.l3 + CFG.dramNs * CFG.ghz); }
  function onCfg(fn){ cfgListeners.push(fn); }

  /* ---------- glossary ---------- */
  var G = {};
  function gloss(key, title, def){ G[key] = {t: title, d: def}; }
  function g(key, label){ return '<dfn data-g="' + key + '">' + (label || (G[key] ? G[key].t : key)) + '</dfn>'; }

  /* ---------- chapters + router ---------- */
  var chapters = [], built = {}, cur = null, extensions = {};
  function chapter(def){ chapters.push(def); }
  function extendChapter(id, fn){(extensions[id]||(extensions[id]=[])).push(fn);}
  function labSection(root,id,title,copy){
    var sec=root.closest('.ch'),chId=sec.id.slice(3);
    if(document.getElementById(chId+'--'+id))throw new Error('Duplicate chapter section: '+id);
    var el=h('section',{'class':'learning-scene scene-active',id:chId+'--'+id,'data-scene':id},root);
    var lead=h('div',{'class':'scene-lead'},el),list=sec._sections||(sec._sections=[]);
    h('span',{'class':'scene-kicker'},lead,String(list.length+1).padStart(2,'0'));
    h('div',null,lead,'<h2>'+title+'</h2>'+(copy?'<p>'+copy+'</p>':''));
    list.push({id:id,title:title,el:el});sec.classList.add('long-scroll');return el;
  }

  var GROUPS = {start: 'Start here', map: 'The machine', code: 'The machine', core: 'The machine', xlate: 'Memory system', l1d: 'Memory system', hier: 'Memory system',
    dram: 'Memory system', stores: 'Memory system', coh: 'Memory system', pref: 'Memory system', dev: 'System path', e2e: 'System path', gloss: 'Reference'};
  function chapterGroup(ch){ return (ch && (ch.group || GROUPS[ch.id])) || 'Chapters'; }
  function chNum(id){ for (var i = 0; i < chapters.length; i++) if (chapters[i].id === id) return chapters[i].num; return '??'; }
  function chLabel(c){ return c.ref ? c.short : c.num + ' \u00b7 ' + c.short; }

  function chapterIndex(id){
    for (var i = 0; i < chapters.length; i++) if (chapters[i].id === id) return i;
    return 0;
  }

  function chapterArt(id){
    var art;
    if (id === 'map'){
      art = h('div', {'class':'chapter-art art-map','aria-hidden':'true'});
      art.innerHTML = '<div class="art-cap">ONE ACCESS / WHOLE MACHINE</div>' +
        '<div class="art-path"><i class="ap-core">CORE</i><b>→</b><i>L1D</i><b>→</b><i>L2</i><b>→</b><i>L3</i><b>→</b><i class="ap-dram">DRAM</i></div>' +
        '<div class="art-address">0x7ffd4a3c2e58 <span>→</span> 0x1a3f7ce58</div>' +
        '<div class="art-grid" aria-hidden="true"></div>';
    } else if (id === 'core'){
      art = h('div', {'class':'chapter-art art-core','aria-hidden':'true'});
      art.innerHTML = '<div class="art-cap">OUT-OF-ORDER / LIVE STATE</div>' +
        '<div class="pipe-row"><span>FETCH</span><i></i><i class="hot"></i><i></i><i></i></div>' +
        '<div class="pipe-row"><span>RENAME</span><i class="hot"></i><i></i><i></i><i></i><i></i><i></i></div>' +
        '<div class="pipe-row"><span>ISSUE</span><i></i><i class="ready"></i><i class="hot"></i><i></i><i></i></div>' +
        '<div class="pipe-row"><span>RETIRE</span><i class="ready"></i><i class="ready"></i><i></i><i></i></div>' +
        '<div class="art-cycle">cycle <b>17</b> · 7 µops in flight</div>';
    } else if (id === 'l1d'){
      art = h('div', {'class':'chapter-art art-l1d','aria-hidden':'true'});
      art.innerHTML = '<div class="art-cap">SET 57 / 8-WAY LOOKUP</div>' +
        '<div class="cache-address"><span>tag 0x1a3f7c</span><span>index 57</span><span>off 24</span></div>' +
        '<div class="cache-ways">' + [0,1,2,3,4,5,6,7].map(function(n){ return '<i class="' + (n === 3 ? 'hit' : '') + '"><b>w' + n + '</b><em>' + (n === 3 ? 'HIT' : '≠') + '</em></i>'; }).join('') + '</div>' +
        '<div class="cache-result">way 3 <b>→ 41</b></div>';
    }
    return art || null;
  }

  function makeChapterHeader(sec, ch){
    var hd = h('header', {'class': 'chh'}, sec);
    var copy = h('div', {'class': 'ch-copy'}, hd);
    h('div', {'class': 'num'}, copy, (ch.ref ? 'REFERENCE' : 'CHAPTER ' + ch.num) + ' · ' + chapterGroup(ch));
    h('h1', null, copy, ch.title);
    if (ch.lede) h('p', {'class': 'ch-lede'}, copy, ch.lede);
    else if (ch.sub) h('p', null, copy, ch.sub);
    if (ch.points && ch.points.length) h('ul', {'class': 'ch-points'}, copy, ch.points.map(function(p){ return '<li>' + p + '</li>'; }).join(''));
    var art = chapterArt(ch.id);
    if (art){ hd.classList.add('has-art'); hd.appendChild(art); }
  }

  function makeChapterFooter(sec, ch){
    var idx = chapterIndex(ch.id), prev = idx > 0 ? chapters[idx - 1] : null, next = idx < chapters.length - 1 ? chapters[idx + 1] : null;
    if (!prev && !next) return;
    var foot = h('footer', {'class':'chapter-footer','aria-label':'Continue through the atlas'}, sec);
    if (prev){
      var bp = h('button', {'class':'chapter-jump prev',type:'button'}, foot,
        '<span>← previous</span><strong>' + chLabel(prev) + '</strong>');
      bp.onclick = function(){ go(prev.id); };
    } else h('span', {'class':'chapter-jump-spacer'}, foot);
    if (next){
      var bn = h('button', {'class':'chapter-jump next',type:'button'}, foot,
        '<span>next →</span><strong>' + chLabel(next) + '</strong>');
      bn.onclick = function(){ go(next.id); };
    }
  }

  function show(id){
    var ch = chapters.filter(function(c){ return c.id === id; })[0] || chapters[0];
    if (!built[ch.id]){
      var sec = h('section', {'class': 'ch ch-' + ch.id, id: 'ch-' + ch.id, 'data-group': chapterGroup(ch)}, document.getElementById('main'));
      makeChapterHeader(sec, ch);
      var body = h('div', {'class': 'stack chapter-body'}, sec);
      built[ch.id] = {sec: sec, api: ch.build(body) || {}};
      enhanceChapter(sec);
      (extensions[ch.id]||[]).forEach(function(fn){fn(body);});
      makeChapterFooter(sec, ch);
    }
    for (var k in built) built[k].sec.classList.toggle('show', k === ch.id);
    cur = ch.id;
    var links = document.querySelectorAll('#nav a');
    for (var i = 0; i < links.length; i++) links[i].classList.toggle('cur', links[i].dataset.id === ch.id);
    var a = document.querySelector('#nav a.cur'); if (a && a.scrollIntoView) a.scrollIntoView({block: 'nearest'});
    var cn = document.getElementById('crumbNum'), ct = document.getElementById('crumbTitle');
    if (cn) cn.textContent = ch.num;
    if (ct) ct.textContent = ch.short;
    setTimeout(secNavUpdate, 0);
    closeNav();
    if (built[ch.id].api.onShow) built[ch.id].api.onShow();
  }

  function route(){
    var p = location.hash.slice(1).split('/');
    show(p[0] || chapters[0].id);
    /* second jump after the workbenches above have finished sizing */
    if (p[1]){ setTimeout(function(){ scrollToSection(p[1], false); }, 30); setTimeout(function(){ scrollToSection(p[1], false); }, 400); } else window.scrollTo({top: 0, behavior: 'instant'});
  }
  function scrollToSection(sid, smooth){
    var current = built[cur]; if (current && current.api.selectSection) current.api.selectSection(sid);
    var el = document.getElementById(cur + '--' + sid); if (!el) return;
    el.scrollIntoView({block: 'start', behavior: smooth ? 'smooth' : 'instant'});
    try { history.replaceState(null, '', '#' + cur + '/' + sid); } catch(e){}
  }
  /* ---------- section menu + reading progress (top bar) ---------- */
  var secNavUpdate = function(){};
  function initSectionNav(){
    var btn = document.getElementById('crumbSec'), lab = document.getElementById('crumbSecTitle'), menu = document.getElementById('secMenu'), prog = document.getElementById('readProg');
    if (!btn || !menu) return;
    var ticking = false, idx = 0;
    function list(){ var b = built[cur]; return ((b && b.sec._sections) || []).filter(function(x){return !x.el.hidden;}); }
    function update(){
      ticking = false;
      var L = list(); idx = 0;
      var lim = (document.querySelector('.top') || {}).offsetHeight + 120 || 170;
      for (var i = 0; i < L.length; i++) if (L[i].el.getBoundingClientRect().top <= lim) idx = i;
      btn.hidden = !L.length;

  /* ---------- stepper: frames = [{t: title, d: html, ...}] ---------- */
  function stepper(parent, opts){
    var wrap = h('div', {'class': 'stack stepper'}, parent);
    var bar = h('div', {'class': 'stp stepper-bar'}, wrap);
    var bBack = h('button', {type:'button'}, bar, '← back');
    var cnt = h('span', {'class': 'cnt'}, bar);
    var bNext = h('button', {'class': 'pri',type:'button'}, bar, 'next →');
    var bReset = h('button', {'class':'ghost',type:'button'}, bar, 'restart');
    h('span', {'class': 'grow'}, bar);
    var pills = h('div', {'class': 'pills'}, bar);
    var prog = h('div', {'class':'step-progress'}, wrap), progFill = h('i', null, prog);
    var narr = h('div', {'class': 'narr'}, wrap);
    var frames = [], i = 0;
    function render(){
      var f = frames[i]; if (!f) return;
      cnt.textContent = (i + 1) + ' / ' + frames.length;
      bBack.disabled = i === 0; bNext.disabled = i === frames.length - 1;
      progFill.style.width = (frames.length <= 1 ? 100 : (i / (frames.length - 1)) * 100) + '%';
      narr.innerHTML = '<h4>' + f.t + '</h4>' + paras(f.d);
      var ps = pills.children;
      for (var k = 0; k < ps.length; k++) ps[k].className = 'pill' + (k === i ? ' cur' : k < i ? ' done' : '');
      if (ps[i] && ps[i].scrollIntoView) ps[i].scrollIntoView({block:'nearest',inline:'nearest'});
      opts.render(f, i);
      try { wrap.dispatchEvent(new CustomEvent('memstepchange',{bubbles:true,detail:{frame:f,index:i,total:frames.length}})); } catch(e){}
    }
    function set(fr, keep){
      frames = fr; if (!keep || i >= frames.length) i = 0;
      pills.innerHTML = '';
      if (opts.pills !== false) frames.forEach(function(f, k){
        var p = h('button', {'class': 'pill',type:'button'}, pills, f.p || String(k + 1));
        p.onclick = function(){ i = k; render(); };
      });
      render();
    }
    bBack.onclick = function(){ if (i > 0){ i--; render(); } };
    bNext.onclick = function(){ if (i < frames.length - 1){ i++; render(); } };
    bReset.onclick = function(){ i = 0; render(); };
    return {
      el: wrap, set: set, render: render,
      key: function(k){ if (k === 'ArrowRight'){ bNext.onclick(); return true; } if (k === 'ArrowLeft'){ bBack.onclick(); return true; } return false; },
      get i(){ return i; }, go: function(k){ i = Math.max(0, Math.min(frames.length - 1, k)); render(); }
    };
  }

  function seg(parent, items, onPick, init){
    var w = h('div', {'class': 'seg'}, parent), bs = [];
    items.forEach(function(it){
      var b = h('button', {type:'button'}, w, it[1]); bs.push(b);
      b.setAttribute('aria-pressed',String(it[0]===init));
      b.onclick = function(){ bs.forEach(function(x){ x.classList.remove('on');x.setAttribute('aria-pressed','false'); }); b.classList.add('on');b.setAttribute('aria-pressed','true');onPick(it[0]); };
      if (it[0] === init) b.classList.add('on');
    });
    return w;
  }

/* ======================= glossary ======================= */
(function(){
var d = App.gloss;
/* --- instructions and front end --- */
d('isa','ISA','Instruction set architecture: the contract between software and hardware (x86-64 here). It fixes what each instruction does to registers and memory, not how the silicon does it.');
d('uop','µop (micro-op)','A simple internal operation the core actually schedules and executes. One x86 instruction becomes one or more µops.');
d('mop','macro-op','AMD\'s tracking unit between x86 instructions and µops. On Zen a macro-op can carry a load, an ALU operation and a store together; the retire queue tracks macro-ops.');
d('pc','PC / RIP','Program counter: the virtual address of the next instruction to fetch. Called RIP on x86-64.');
d('bp','branch predictor','Hardware that guesses, before decode, whether a branch is taken and where it goes, so fetch never waits for the branch to execute.');
d('btb','BTB','Branch target buffer: a cache keyed by fetch address that remembers where previously seen branches jumped. A BTB hit lets fetch redirect in the same cycle.');
d('ras','RAS','Return address stack: a small hardware stack that pushes on CALL and pops on RET to predict return targets.');
d('l1i','L1i','Level-1 instruction cache. 64 KB, 4-way on Zen+. Fetch reads 32 bytes per cycle from it.');
d('itlb','iTLB','Instruction TLB: translates the fetch address (virtual) to a physical address for the L1i tag check.');
d('fetchwin','fetch window','The aligned block of bytes fetch reads in one cycle (32 bytes on Zen+). Instructions are carved out of it afterwards.');
d('predecode','predecode / pick','Finds where each variable-length x86 instruction starts and ends inside the fetch window, so decoders get whole instructions.');
d('decode','decode','Translates x86 instructions into macro-ops / µops. Zen+ decodes up to 4 x86 instructions per cycle.');
d('opcache','op cache','A cache of already-decoded µops, keyed by instruction address. A hit skips predecode and decode entirely. 2K entries on Zen/Zen+.');
d('uq','µop queue','A buffer between decode and rename that absorbs rate mismatches between the front end and the back end.');
d('fusion','macro-fusion','Merging a compare/test with the following conditional jump into one operation. On Zen it happens at dispatch; this model shows it fused from decode on for readability.');
d('zx','zero extension','Filling the upper bits of a wider destination with zeros. movzbl reads 1 byte and writes 32 bits; writing a 32-bit register also zeroes bits 63:32.');
d('modrm','ModRM / SIB','Encoding bytes that say which registers and addressing form an instruction uses. SIB adds scale, index and base for addresses like (%rdx,%rax,8).');
d('rex','REX prefix','A prefix byte (0x40-0x4F) that enables 64-bit operand size (REX.W) and access to r8-r15.');
/* --- rename / OoO --- */
d('rename','register renaming','Mapping each architectural register write to a fresh physical register, so only true data dependencies (RAW) remain.');
d('rat','RAT','Register alias table: for every architectural register, the physical register currently holding its newest value. Read for sources, written for destinations at rename.');
d('crat','committed RAT','The architectural-state copy of the RAT, updated only at retirement. After a squash the speculative RAT is rebuilt from it.');
d('prf','PRF','Physical register file: the actual storage for register values. Zen+ has 168 integer entries; each has a ready bit.');
d('freelist','free list','The list of physical registers holding nothing live. Rename takes from it; retirement (and squash) give registers back.');
d('dispatch','dispatch / allocate','Placing renamed operations into the back end: one retire-queue entry, scheduler entries, and load/store-queue entries. Stalls if any of those is full.');
d('rob','ROB / retire queue','Reorder buffer: an in-order circular buffer of every in-flight instruction. Instructions enter in program order, may finish out of order, and leave (retire) only from the head, in order. 192 entries on Zen+ (96 per SMT thread).');
d('sched','scheduler','A queue of waiting µops that watches for their source operands to become ready and picks ready ones for execution. Zen+ has four 14-entry ALU schedulers and two 14-entry AGU schedulers.');
d('wakeup','wakeup','When a µop\'s result is about to be produced, its destination tag is broadcast to the schedulers; waiting µops that need that tag mark the operand ready.');
d('issue','issue / select','Each cycle, each execution port takes the oldest ready µop from its scheduler.');
d('port','execution port','An entry point into a functional unit. Zen+ integer side: 4 ALU ports and 2 AGU ports.');
d('alu','ALU','Arithmetic-logic unit: adds, compares, logic, shifts, branch resolution.');
d('agu','AGU','Address generation unit: computes base + index*scale + displacement for loads and stores.');
d('bypass','bypass network','Wires that forward a result straight from a unit\'s output to the next µop\'s input, without a round trip through the register file.');
d('lsu','load/store unit','The part of the core that holds in-flight loads and stores, translates their addresses and accesses the L1d.');
d('lq','load queue','Holds every in-flight load in program order until it retires. 44 entries on Zen+.');
d('sq','store queue / store buffer','Holds every in-flight store (address + data) in program order. Before retirement it enables forwarding; after retirement its entries are committed to the L1d one at a time. 44 entries on Zen+.');
d('sta','store-address µop','The half of a store that computes the address (on an AGU) and writes it into the store-queue entry.');
d('std','store-data µop','The half of a store that delivers the value to be stored into the store-queue entry.');
d('stlf','store-to-load forwarding','A load may obtain bytes from an older buffered store before that store reaches the cache. Byte coverage, available data, size/alignment support and address disambiguation determine whether forwarding is possible; an address match alone is not sufficient.');
d('disamb','memory disambiguation','Deciding whether a load may run before older stores whose addresses are still unknown. Hardware predicts \'no overlap\' and replays the load if that turns out wrong.');
d('retire','retire','The in-order step where a finished instruction\'s results become architectural state: its old physical registers are freed and its store becomes eligible to commit.');
d('commit','store commit','Writing a retired store from the store queue into the L1d. Only here does the store become visible to other cores.');
d('senior','senior store','A store that has retired but still sits in the store queue waiting to commit. It must still forward to younger loads.');
d('squash','squash / flush','Discarding every instruction younger than a mispredicted branch (or a faulting instruction): their ROB, scheduler, queue entries and physical registers are released.');
d('mispredict','misprediction','The branch predictor guessed wrong. Detected when the branch executes; costs the refill time of the front end \u2014 tens of cycles, and directly measurable with a branch-heavy loop over sorted vs. random data.');
d('spec','speculative execution','Executing instructions before it is known that they are on the correct path. Their effects stay inside the core until retirement.');
d('smt','SMT','Simultaneous multithreading: two hardware threads share one core\'s pipeline and caches. Your 3750H has 4 cores, 8 threads.');
d('ipc','IPC','Instructions retired per cycle.');
d('mab','MAB / MSHR','Miss address buffer (AMD) / miss status holding register: one entry per outstanding cache-line miss. Later misses to the same line merge into the existing entry.');
/* --- cache vocabulary --- */
d('line','cache line','The 64-byte unit every cache level stores and transfers.');
d('set','set','The group of lines an address\'s index bits select. An address can live only in its own set.');
d('way','way','One slot within a set. An 8-way cache has 8 places per set for any given index.');
d('tag','tag','The upper address bits stored with a line so a lookup can confirm which memory block occupies that slot.');
d('index','index','The address bits that select a set.');
d('offset','offset','The low 6 address bits that select a byte within a 64-byte line.');
d('hit','hit','The requested line is present in that cache level.');
d('miss','miss','The requested line is not present; the request goes to the next level.');
d('valid','valid bit','Marks whether a way holds a real line. A tag match counts only if valid = 1.');
d('dirty','dirty bit','Marks that a line was written after it was filled, so the next level holds a stale copy.');
d('wbk','write-back','A write updates only the cache line and sets its dirty bit; the next level is updated only when the line is evicted.');
d('wthru','write-through','Every write is also sent to the next level immediately.');
d('walloc','write-allocate','On a write miss, the line is first fetched into the cache, then written.');
d('rfo','RFO','Read for ownership: fetching a line with exclusive permission because the core intends to write it. Other cached copies are invalidated.');
d('evict','eviction','Removing a line from a full set to make room. A dirty victim must be written back first.');
d('plru','pseudo-LRU','A cheap approximation of least-recently-used replacement: a small binary tree of bits per set that points toward the older half at each level.');
d('waypred','way predictor (\u00b5tag)','AMD\u2019s L1d guesses which way holds a line from a \u00b5tag, a small hash of virtual-address bits, and reads only that way to save power. The full physical tag is still compared. A \u00b5tag that matches nothing counts as a miss, and a line can sit in the L1d under only one \u00b5tag at a time. The hash is undocumented; Lipp et al. reverse-engineered it on Zen and Zen+.');
d('vipt','VIPT','Virtually indexed, physically tagged: the L1 set is chosen with virtual-address bits while the TLB translates in parallel; the tag compare uses the physical address. Works because bits 11:6 are inside the 4 KB page offset and never change in translation.');
d('incl','inclusive cache','A cache that holds a copy of every line held by the smaller caches above it. Zen+\'s L2 is inclusive of its L1s.');
d('victimc','victim cache','A cache filled only with lines evicted from the level above. Zen+\'s L3 is filled from L2 victims and is mostly exclusive of the L2s.');
d('shadow','shadow tags','Copies of every L2\'s tags kept inside the L3. They let the L3 know which core might hold a line without asking all of them.');
d('pfilter','probe filter','A structure that records which caches may hold a line, so coherence probes go only where needed instead of to every cache.');
d('ccx','CCX','Core complex: a group of up to four Zen cores sharing one L3. Your 3750H has one CCX with 4 MB of L3.');
d('mlp','memory-level parallelism','Having several cache misses outstanding at once so their latencies overlap. Scaling stops at a finite resource. The legacy 50/96 miss-tracking reference values are not verified limits for the 3750H.');
d('ltu','load-to-use latency','Cycles from a load issuing to the first cycle a dependent instruction can use its value.');
d('wset','working set','The set of addresses a program actively uses during some interval.');
d('sloc','spatial locality','The tendency to access addresses near recently accessed ones.');
d('tloc','temporal locality','The tendency to access the same address again soon.');
d('sram','SRAM','Static RAM: 6 transistors per bit, fast, no refresh. Caches and register files are SRAM.');
d('dramcell','DRAM cell','One transistor plus one capacitor per bit (1T1C). Dense and cheap, but reading drains the capacitor and charge leaks, so rows need restoring and periodic refresh.');
/* --- translation --- */
d('va','virtual address','The address a program uses. 48 bits wide on x86-64 with 4-level paging.');
d('pa','physical address','The address actually sent to caches and DRAM after translation.');
d('page','page','The unit of translation: 4 KB by default, also 2 MB and 1 GB huge pages.');
d('vpn','VPN','Virtual page number: the virtual address with its page-offset bits removed.');
d('pfn','PFN','Page frame number: the physical page number a VPN maps to.');
d('mmu','MMU','Memory management unit: the TLBs, page walkers and permission checks that turn virtual addresses into physical ones.');
d('tlb','TLB','Translation lookaside buffer: a cache of recent VPN-to-PFN translations plus permission bits.');
d('dtlb','DTLB','Data TLB. Zen+: 64-entry fully associative L1 DTLB (all page sizes) backed by a 1536-entry L2 TLB (no 1 GB pages).');
d('pte','PTE','Page-table entry: 8 bytes holding a physical frame number plus flag bits (present, writable, user, accessed, dirty, no-execute...).');
d('pml4','PML4 / PDPT / PD / PT','The four page-table levels on x86-64. Each is one 4 KB page of 512 eight-byte entries, indexed by 9 bits of the virtual address.');
d('cr3','CR3','The control register holding the physical address of the current process\'s top-level page table (and its PCID). Writing it switches address spaces.');
d('walk','page walk','Reading the page-table entries level by level to translate an address after a TLB miss. Each step is a real memory load that goes through the data caches.');
d('pwc','page-walk cache','Caches upper-level page-table entries so a walk can skip levels. Published measurements report a 64-entry cache for PML4E/PDPE entries on Zen.');
d('reach','TLB reach','How much memory the TLB can map at once: entries × page size. 64 × 4 KB = 256 KB for the L1 DTLB.');
d('huge','huge page','A 2 MB (or 1 GB) page. One TLB entry covers 512× (or 262144×) more memory, and the walk ends one (or two) levels early.');
d('pcid','PCID','Process-context identifier: a 12-bit tag on TLB entries so switching CR3 need not flush every translation.');
d('pf','page fault','Exception 14 (#PF), raised when a translation is missing or a permission check fails. CR2 receives the faulting address and the kernel handles it.');
d('ftouch','first-touch','Linux\'s default NUMA policy: a page is physically allocated on the node of the CPU that first writes it, not the one that called malloc.');
/* --- fabric, DRAM, I/O --- */
d('fabric','Infinity Fabric (data fabric)','AMD\'s on-chip interconnect linking the CCX, memory controllers, graphics and I/O. Coherent: it routes requests and coherence probes.');
d('umc','UMC','Unified memory controller: queues memory requests, schedules DRAM commands, enforces timing rules, and performs refresh.');
d('channel','memory channel','An independent 64-bit data bus plus command/address bus to a set of DIMMs. The Ryzen 7 3750H has two.');
d('dimm','DIMM / rank','A memory module. A rank is the set of chips that together drive the 64-bit bus (8 chips × 8 bits).');
d('bank','bank / bank group','An independent cell array inside each DRAM chip. DDR4 x8 chips have 16 banks in 4 bank groups; different banks can work in parallel.');
d('row','row / column','A bank is a matrix of rows × columns. A whole row is opened at once; reads then select columns from it.');
d('rowbuf','row buffer','The bank\'s sense amplifiers after ACT: they hold the open row. Reads from the open row are fast; any other row needs PRE + ACT first.');
d('act','ACT / RD / WR / PRE / REF','DRAM commands: activate (open a row into the row buffer), read, write, precharge (close the row), refresh.');
d('tcl','CL, tRCD, tRP, tRAS','DRAM timings: CL = RD to first data; tRCD = ACT to RD; tRP = PRE to next ACT; tRAS = ACT to PRE minimum.');
d('burst','burst','One DDR4 read transfers 8 beats on the 64-bit bus: 8 × 8 bytes = 64 bytes, exactly one cache line.');
d('refresh','refresh','Rewriting every row before its capacitors leak. DDR4 issues REF about every 7.8 µs and covers every row within 64 ms.');
d('pcie','PCIe','The serial point-to-point link to devices such as the NVMe SSD. Traffic travels as packets called TLPs.');
d('tlp','TLP','Transaction-layer packet on PCIe: memory read (non-posted, answered by a completion with data), memory write (posted, no reply), message, etc.');

d('bar','BAR','Base address register: tells the system where a PCIe device\'s MMIO registers sit in the physical address space.');
d('doorbell','doorbell','An MMIO register the driver writes to tell a device that new work is in a queue.');
d('dma','DMA','Direct memory access: a device reads or writes host memory itself, without the CPU copying each byte.');
d('iommu','IOMMU','An MMU for devices: translates device-visible addresses (IOVAs) to physical addresses and blocks access outside what the OS mapped.');
d('iova','IOVA','I/O virtual address: the address a device uses for DMA when an IOMMU is enabled.');
d('msix','MSI-X','Message-signaled interrupts: a device raises an interrupt by writing a small message to a special address the interrupt controller watches.');
d('nvme','NVMe','The SSD protocol built around memory-resident submission and completion queues plus doorbell registers. io_uring was designed around the same ring idea.');
d('iocoh','I/O coherence','On x86, DMA traffic is snooped against CPU caches: device reads see dirty cached data and device writes invalidate stale cached copies.');

d('memtype','memory type','How the caches treat an address range: WB (write-back, normal RAM), WT (write-through), WC (write-combining), UC (uncacheable), WP (write-protect). Set by PAT bits in page tables and by MTRRs.');

/* --- coherence --- */
d('coh','cache coherence','The guarantee that all cores observe a single order of writes to each address, even though each core has private caches.');
d('moesi','MOESI','AMD\'s coherence states: Modified, Owned, Exclusive, Shared, Invalid.');
d('st_m','M (Modified)','Only this cache has the line and it is dirty. It may be read and written without asking anyone.');
d('st_o','O (Owned)','This cache has a dirty copy and other caches share it. The owner answers requests with data; memory is stale.');
d('st_e','E (Exclusive)','Only this cache has the line and it is clean. A write upgrades it to M silently.');
d('st_s','S (Shared)','Several caches may hold this clean (or owner-backed) copy. A write first needs the others invalidated.');
d('st_i','I (Invalid)','The line is not usable in this cache.');
d('probe','probe / snoop','A coherence message asking another cache to return, downgrade, or invalidate its copy of a line.');
d('fshare','false sharing','Two cores writing different variables that share one 64-byte line. Alternating writers need writable ownership of the same line, so ownership can bounce even though the variables are independent. Repeated writes by a retained owner do not require a new transfer each time.');
/* --- prefetch --- */
d('pref','hardware prefetcher','Logic that watches the stream of miss/access addresses and fetches lines it predicts will be needed, before the program asks.');
d('stream','stream prefetcher','Detects accesses to consecutive lines in one direction and runs ahead along them.');
d('stride','stride prefetcher','Detects a constant distance between successive accesses from the same instruction and fetches ahead by that stride.');
d('swpf','software prefetch','Instructions (prefetcht0/t1/t2/nta) that ask the hardware to start fetching a line without waiting for the data.');
d('late','late prefetch','A prefetch that was issued but whose data had not arrived when the demand access came; the access still waits, but less.');
d('pollute','cache pollution','Useless prefetched lines evicting useful ones.');
d('memwall','memory wall','The widening gap between CPU speed and DRAM latency. The reason the whole hierarchy exists.');
})();

/* ======================= glossary: foundations, registers, instructions ======================= */
(function(){
var d = App.gloss;
/* --- foundations --- */
d('bit', 'bit', 'One binary digit: 0 or 1. Every value the machine stores, from a count to an instruction, is a pattern of bits.');
d('byte', 'byte', '8 bits, holding a value from 0 to 255. Memory is addressed in bytes: every address names one byte.');
d('hex', 'hexadecimal (0x\u2026)', 'Base-16 notation, written with a 0x prefix and the digits 0\u20139 and a\u2013f. One hex digit is exactly 4 bits, so two digits make a byte: 0xff = 255, 0x40 = 64. Addresses and machine code are written in hex because the digits map straight onto bits.');
d('bitrange', 'bit range (bits 11:6)', 'A slice of a number\u2019s bits, highest bit first, counting from bit 0 at the right. Bits 11:6 of an address are the six bits from bit 11 down to bit 6; in C, (addr >> 6) & 0x3f. Hardware splits addresses into fields this way.');
d('addr', 'address', 'The number of one byte in memory. A pointer holds an address, and every load or store names the address it touches. On x86-64, user programs use addresses below 0x800000000000.');
d('ptr', 'pointer', 'A variable that holds an address. In the example, data and hist are pointers: data[i] is the byte at address data + i.');
d('endian', 'little-endian', 'The byte order x86 uses: the least significant byte of a multi-byte value is stored at the lowest address. The 8-byte count 41 (0x29) is stored as 29 00 00 00 00 00 00 00.');
d('align', 'alignment', 'An N-byte value is aligned when its address is a multiple of N. An aligned value of 64 bytes or less never straddles two cache lines, so one access reaches all of it.');
d('reg', 'register', 'A small, named storage slot inside the core. Instructions compute on registers; a value in memory must be loaded into a register first.');
d('instr', 'instruction', 'One operation defined by the ISA, such as add or movzbl. In memory it is 1 to 15 bytes of machine code; the core decodes it into one or more \u00b5ops.');
d('mcode', 'machine code', 'Instructions encoded as bytes: the form the CPU fetches and decodes. objdump -d prints each instruction\u2019s bytes next to its assembly text.');
d('asmlang', 'assembly language', 'A text form of machine code, one line per instruction, such as addq $0x1,(%rdx,%rax,8). This site uses AT&T syntax, the default of gcc and objdump.');
d('att', 'AT&T syntax', 'The assembly syntax gcc and objdump print by default: source before destination, % before registers, $ before constants, a size suffix on the mnemonic, and memory operands written disp(base,index,scale).');
d('load', 'load', 'An operation that reads memory into a register. Its latency depends on where the data is found: L1d, L2, L3 or DRAM.');
d('store', 'store', 'An operation that writes a register to memory. It waits in the store queue and reaches the L1d only after its instruction retires.');
d('flags', 'flags (RFLAGS)', 'Status bits that arithmetic and compare instructions set: zero, sign, carry, overflow. Conditional jumps read them.');
d('cycle', 'clock cycle', 'One tick of the core clock. At 4 GHz a cycle lasts 0.25 ns. Work inside the core is counted in cycles; DRAM delays are often quoted in nanoseconds.');
d('latency', 'latency', 'The time from starting an operation to having its result. For a load, the time until the loaded value can be used.');
d('thruput', 'throughput', 'How many operations complete per cycle when many are in flight. A pipelined unit with a 3-cycle latency can still finish one operation every cycle.');
d('pipeline', 'pipelining', 'Splitting work into stages so several operations are in different stages at once. It raises throughput without making any single operation faster.');
d('depchain', 'dependency chain', 'A sequence of operations where each needs the previous result. A chain cannot overlap, so its time is the sum of its latencies.');
d('proc', 'process', 'A running program with its own virtual address space. Two processes can use the same virtual address for different data.');
d('interrupt', 'interrupt', 'A signal that makes a core stop its current work and run a kernel handler. NVMe devices signal completions with MSI-X interrupts.');
/* --- registers --- */
d('gpr', 'general-purpose registers', 'The 16 64-bit integer registers of x86-64: rax, rbx, rcx, rdx, rsi, rdi, rbp, rsp and r8\u2013r15. Each also has names for its low 32, 16 and 8 bits, for example eax, ax and al.');
d('r_rax', 'rax (eax)', 'General-purpose register; eax is its low 32 bits. In the loop, movzbl (%rdi),%eax puts the byte data[i] in eax. Writing eax clears bits 63:32, so rax holds a clean index from 0 to 255 for hist.');
d('r_rdi', 'rdi', 'General-purpose register that carries the first argument. Here it arrives holding data, and add $0x1,%rdi advances it one byte per iteration in place of the counter i.');
d('r_rsi', 'rsi', 'General-purpose register that carries the second argument. Here it arrives holding n; add %rdi,%rsi turns it into the end pointer data + n that the loop compares against.');
d('r_rdx', 'rdx', 'General-purpose register that carries the third argument. Here it holds hist, the base address of the table: addq $0x1,(%rdx,%rax,8) adds 1 at rdx + rax \u00d7 8.');
d('r_rsp', 'rsp', 'The stack pointer: the address of the top of the stack. ret reads the return address at [rsp] and adds 8 to rsp.');
/* --- instructions --- */
d('i_mov', 'mov', 'Copy a value: register to register, memory to register (a load) or register to memory (a store). The suffix gives the size: movq 8 bytes, movl 4, movw 2, movb 1.');
d('i_movzx', 'movzbl / movzx', 'Load one byte and zero-extend it to 32 bits: the upper bits become 0. AT&T syntax calls it movzbl, Intel syntax movzx. The loop uses it to read data[i].');
d('i_add', 'add', 'Integer addition: the destination becomes destination + source, and the flags are set. With a memory destination, as in addq $0x1,(%rdx,%rax,8), one instruction loads, adds and stores.');
d('i_inc', 'inc', 'Add 1 to a register or a memory location. On memory it is a read-modify-write, like add $1.');
d('i_cmp', 'cmp', 'Subtract the first operand from the second and keep only the flags. cmp %rsi,%rdi compares rdi with rsi for the jne that follows.');
d('i_test', 'test', 'Bitwise AND of two operands, keeping only the flags. test %rsi,%rsi checks whether n is zero or negative.');
d('i_jcc', 'conditional jump (jne, jle)', 'Jump to a label if the flags meet a condition, otherwise continue with the next instruction. jne .L3 repeats the loop until the data pointer equals the end pointer.');
d('i_ret', 'ret', 'Return from a function: load the return address from the stack and jump to it.');
d('i_nop', 'nop', 'An instruction that does nothing. gcc inserts multi-byte nops such as nopl to move a loop start onto a 16-byte boundary.');
d('i_lock', 'lock prefix', 'Makes a read-modify-write instruction on memory atomic: the core keeps the cache line to itself for the whole operation. On x86 a locked instruction also acts as a full memory fence.');

App.setCategory('bit byte hex bitrange addr ptr endian align reg instr mcode asmlang att load store flags cycle latency thruput pipeline depchain proc interrupt', 'basics');
App.setCategory('gpr r_rax r_rdi r_rsi r_rdx r_rsp i_mov i_movzx i_add i_inc i_cmp i_test i_jcc i_ret i_nop i_lock', 'core');

/* ======================= shared hardware parts ======================= */
/* Drawing helpers for structures that several chapters show: core blocks, set-associative arrays,
   L3 slices, shadow tags, DRAM ranks, cache lines, device pipelines and a latency ladder.
   Each helper draws inside a box the chapter has already laid out, so chapter geometry and the
   view-tab camera boxes do not move.
   Highlight convention: a cell that stands for the running example gets class 'box', so it lights up
   with its parent group when the chapter marks that group 'on' (svg .on .box). Every other cell uses
   'sunk' or a colour class and never lights by itself.
   Text size and colour are set with inline style: the stylesheet overrides SVG presentation
   attributes such as font-size="10" or fill="...". */
(function(){
  var s = App.s;
  /* MOESI state -> [letter, cell class, text colour] */
  var STATE = {M: ['M', 'a1b', 'var(--a1)'], O: ['O', 'a3b', 'var(--a3)'], E: ['E', 'a2b', 'var(--a2)'], S: ['S', 'a4b', 'var(--a4)'], I: ['\u2013', 'sunk', 'var(--tx3)']};

  function txt(g, x, y, t, o){
    o = o || {};
    var st = 'font-size:' + (o.size || 10) + 'px';
    if (o.fill) st += ';fill:' + o.fill;
    if (o.weight) st += ';font-weight:' + o.weight;
    return s('text', {x: x, y: y, 'class': o.cls || '', 'text-anchor': o.anchor || 'start', style: st}, g, t == null ? '' : String(t));
  }
  function rect(g, x, y, w, h, cls, rx){ return s('rect', {x: x, y: y, width: w, height: h, rx: rx == null ? 3 : rx, 'class': cls || 'sunk'}, g); }

  /* Labelled sub-blocks in a grid. items: [{t, sub, cls}] */
  function blocks(g, x, y, w, h, items, o){
    o = o || {};
    var cols = o.cols || 1, gap = o.gap == null ? 5 : o.gap, rows = Math.ceil(items.length / cols);
    var bw = (w - gap * (cols - 1)) / cols, bh = (h - gap * (rows - 1)) / rows, out = [];
    items.forEach(function(it, i){

  var wrap = h('div', {'class': 'scroller'}, root);
  var sv = s('svg', {viewBox: '0 0 1200 520', style: 'min-width:900px'}, wrap);
  var note = h('div', {'class': 'card'}, root);

  function stream(){
    var L = [], i, rnd = 12345, R = function(){ rnd = (rnd * 1103515245 + 12345) & 0x7fffffff; return rnd >> 16; };

  function validatePrefetch(data){if(!data||data.schema!=='memory-lab-prefetch-v1'||!data.context||typeof data.context!=='object'||Array.isArray(data.context)||!Array.isArray(data.samples)||!data.samples.length||data.samples.length>5000)throw new Error('Expected memory-lab-prefetch-v1 with context and 1–5000 samples.');data.samples.forEach(function(r){['bytes','loads','passes','elapsed_ns','useful_bytes','stride_lines','cpu_before','cpu_after'].forEach(function(k){if(!Number.isSafeInteger(r[k])||r[k]<(k.startsWith('cpu')?0:1))throw new Error('Invalid '+k);});if(!Number.isSafeInteger(r.distance)||r.distance<0||r.distance>64||r.bytes<4096||r.bytes>268435456||(r.bytes&(r.bytes-1))||r.passes>64||r.stride_lines>63||!(r.stride_lines%2)||r.loads!==(r.bytes/64)*r.passes||String(r.expected_checksum)!==String(r.passes*(r.bytes/64)*(r.bytes/64+1)/2)||r.useful_bytes!==r.loads*8||r.cpu_before!==r.cpu_after||r.cpu_before!==data.context.cpu||r.verified!==true||String(r.checksum)!==String(r.expected_checksum))throw new Error('Invalid prefetch verification or accounting.');});return data;}
  function prefetchMeasurements(sec){U.text('h3',sec,'Measure software prefetch separately');U.code(sec,'python3 benchmarks/prefetch.py --output prefetch-results.json\n# Pin with --cpu after checking topology; inspect emitted assembly.');U.text('p',sec,'The native experiment reads one 8-byte word per 64-byte line at fixed strides and sweeps software prefetch distance. It preserves work, warms, pins before first touch, randomizes case order and verifies every checksum. This tests compiler-emitted hints plus the real hardware’s existing policies; it does not measure the browser detector or disable hardware prefetching.');var label=h('label',{'class':'perf-field'},sec);U.text('span',label,'Import native prefetch results');var input=h('input',{type:'file',accept:'.json,application/json','aria-label':'Native prefetch result JSON'},label),status=U.text('p',sec,'No native prefetch results loaded.',{role:'status','class':'prefetch-status'}),out=h('div',{'class':'prefetch-results'},sec);input.onchange=async function(){out.replaceChildren();try{var file=input.files[0];if(!file)return;if(file.size>2097152)throw new Error('Maximum file size is 2 MiB.');var data=validatePrefetch(JSON.parse(await file.text())),groups={};data.samples.forEach(function(r){var key=[r.bytes,r.stride_lines,r.distance,r.loads].join(' / ');(groups[key]||(groups[key]=[])).push(r);});status.textContent='Measured software-prefetch data · '+String(data.context.cpu_model||'unknown CPU');U.table(out,['Bytes / stride lines / distance / loads','Trials','Median ns/load','p95 of trial averages'],Object.keys(groups).sort().map(function(k){var a=groups[k].map(function(r){return r.elapsed_ns/r.loads;}),q=M.quantiles(a);return [k,a.length,q.p50.toFixed(2),q.p95.toFixed(2)];}));var details=h('details',null,out);U.text('summary',details,'Original measurement context');U.code(details,JSON.stringify(data.context,null,2));U.text('p',out,'These are whole-trial averages, not individual-load tails. Useful bytes do not establi   function dma(root){var sec=section(root,'iotlb','A DMA mapping has a lifetime','Device-visible translations and pinned physical pages are different state.');model(sec,'A single DMA domain has two mapped IOVA pages, discontiguous physical frames and a small explicit translation cache. The walkthrough uses a synchronous invalidation policy after quiescing DMA. Real IOMMUs can batch/defer invalidation with safe reuse rules. ATS, PASID, device translation caches, permissions and architecture-specific invalidation commands are outside this story.');U.checkpoint(sec,'The OS removes an IOMMU page-table entry. Can it immediately reuse the old physical page while DMA or a cached translation remains?',['No: finish DMA and make invalidation safe first','Yes: editing the table alone stops every access'],0,'Step through quiescence, table removal, invalidation acknowledgement and unpinning.');var trace=M.dmaStory(),state=h('div',{'class':'cache-state'},sec),step=App.CacheUI.replayControls(sec,'DMA mapping event',function(i){var q=trace[i];state.replaceChildren();U.text('h3',state,'Event '+i+' · '+q.action);U.text('p',state,q.note);U.table(state,['State','Contents'],[['IOMMU mapping',q.mapping.map(function(x){return x.iova+' → frame '+x.frame;}).join(' / ')||'none'],['IOTLB cache',q.tlb.map(function(x){return x.iova+' → frame '+x.frame;}).join(' / ')||'empty'],['Pinned / reserved frames',q.pins.join(' / ')||'none'],['In-flight DMA',q.inflight]]);});sec._dmaStory=trace;step.set(trace.length);U.table(sec,['Mechanism','Meaning'],[['Pinning','Keeps a physical page available for an I/O lifetime; it does not by itself grant DMA permission.'],['DMA mapping','Produces an address the device can use and establishes platform-specific translation/coherency handling. CPU virtual addresses are not DMA addresses.'],['Scatter-gather','Describes multiple memory segments. dma_map_sg may merge entries; the driver programs the returned DMA segments and uses the original entry count when unmapping.'   function io(root){var sec=section(root,'queues','Queue depth is a memory-system choice','Completion delivery changes how quickly an application can recycle its buffers.');model(sec,'Fixed 4 KiB requests circulate through a bounded application outstanding window and bounded completion queue. A chosen device initiation interval represents aggregate service parallelism; data returns serialize on a shared DMA link. Translation is looked up once at admission in an LRU IOTLB; no finite IOMMU walker is modeled. CQ-blocked completions retain outstanding slots. CPU submission/handling work, moderation and periodic polling use one model CPU. This is a queue abstraction, not NVMe timing, PCIe packet accuracy, MSI-X vector allocation or an io_uring kernel implementation.');U.checkpoint(sec,'If completion interrupts are delayed to reduce interrupt count, can throughput fall even though device service stays the same?',['Yes: completed requests can hold the outstanding window full','No: completion handling is outside the throughput path'],0,'Lower queue depth and increase moderation; compare device-ready latency with application-observed latency.');var o={count:48,qd:8,deviceSlots:4,cq:8,batch:4,pages:8,iotlb:4,mode:'irq',moderation:8,poll:4,remote:false,reuse:true};controls(sec,o,[['qd','Application outstanding limit',[1,2,4,8,16,32]],['deviceSlots','Device service parallelism',[1,2,4,8]],['cq','Completion queue entries',[1,2,4,8,16]],['batch','Submit / completion batch',[1,2,4,8]],['pages','Reused buffer pages',[1,4,8,16]],['iotlb','Model IOTLB entries',[1,4,8,16]],['reuse','Buffer IOVA lifetime',[[1,'Reuse a mapped buffer pool'],[0,'Fresh mapped page per request']]],['mode','Completion delivery',[['irq','Interrupt + moderation'],['poll','Periodic polling']]],['moderation','Interrupt moderation delay',[1,8,24,64]],['poll','Polling interval',[1,4,16]],['remote','DMA memory placement',[[0,'Local to device node'],[1,'Across chosen remote link']]]],run);var metrics=h('div',{'class':'perf-metrics'},sec),summary=h('div',null,sec),state=h('div',{'class':'cache-state'},sec),svg=plot(sec,'Completion queue occupancy over I/O model time'),r,step=App.CacheUI.replayControls(sec,'I/O queue clock',function(i){if(!r)return;var q=r.trace[i];state.replaceChildren();U.text('h3',state,'Clock '+q.t+' · submitted '+q.submitted+' · reaped '+q.seen);U.table(state,['Finite structure','Request IDs / translation pages'],[['Outstanding '+q.active.length+'/'+o.qd,q.active.join(' / ')||'empty'],['CQ '+q.cq.length+'/'+o.cq,q.cq.join(' / ')||'empty'],['IOTLB MRU → LRU',q.tlb.join(' / ')||'empty'],['Pending interrupt deadline',q.irqDue===null?'none':q.irqDue]]);});

  function multisocket(root){var sec=section(root,'multisocket','Two sockets add shared remote links','First touch changes both traffic placement and the bottleneck.');model(sec,'Server extension: two sockets with one memory node each, independent node request intervals and one finite return-link interval per direction. Threads alternate initial CPU sockets, issue a fixed number of 64-byte reads with chosen MLP, and can migrate to the opposite socket without moving pages. Placement is first-touch on one node, interleaved, or parallel first-touch by the original thread. All latencies and intervals are chosen clocks. No caches, coherence ownership, physical address hash, page migration policy or actual 3750H multisocket topology is implied.');U.checkpoint(sec,'All worker pages were initialized on socket 0. If half the workers run on socket 1, does increasing cores necessarily double bandwidth?',['No: node-0 service and remote links can saturate','Yes: every core has independent memory bandwidth'],0,'Compare parallel first touch with serial first touch, then migrate threads while preserving page homes.');var o={threads:4,count:32,placement:'first',first:0,migrate:false,mlp:4,linkGap:8};controls(sec,o,[['threads','Server worker threads',[2,4,8]],['placement','Server page placement',[['first','Serial first touch on one node'],['parallel','Parallel first touch by original worker'],['interleave','Alternate page homes']]],['first','Serial first-touch node',[0,1]],['migrate','Worker migration',[[0,'Original CPUs'],[1,'Opposite socket; pages unchanged']]],['mlp','Outstanding reads per worker',[1,2,4,8]],['linkGap','Remote return-line interval',[2,4,8,16]]],run);var metrics=h('div',{'class':'perf-metrics'},sec),out=h('div',null,sec),r;function run(){r=M.numa(o);sec._multisocketResult=r;metrics.replaceChildren();out.replaceChildren();U.metric(metrics,'Local / remote requests',r.stats.local+' / '+r.stats.remote,'Page homes remain fixed after migration');U.metric(metrics,'Node 0     function run(){checks.forEach(function(c,k){c.checked=flips.indexOf(k+1)>=0;});var r=M.ecc(payload,flips);sec._eccResult=r;out.replaceChildren();U.text('h3',out,r.status);U.table(out,['Stage','Bits 1 → 8'],[['Encoded',r.encoded.join(' ')],['Received',r.received.join(' ')],['Decoder output',r.correctedBits.join(' ')]]);U.text('p',out,'Syndrome '+r.syndrome+' · overall parity '+r.overall+' · correction position '+(r.corrected||'none')+' · decoded payload '+r.decoded.toString(2).padStart(4,'0'));U.text('p',out,r.guaranteed?'Within SECDED’s stated zero/single/double-bit guarantee. A detected double error must not be treated as repaired data.':'Outside the guarantee: the decoder can miscorrect or miss a larger error. Injected ground truth is known only to this teaching UI; a real decoder cannot count all original flips from the received codeword.');}run();U.text('p',sec,'ECC availability requires support across the CPU/controller, firmware, board and installed memory. DDR5 on-die ECC is internal to a DRAM chip and does not by itself establish end-to-end system ECC protection. EDAC/RAS counters can report corrected and uncorrected events when supported; missing counters do not prove a memory system is error-free. ECC reduces particular error risks and is not a universal Rowhammer mitigation.');refs(sec,['edac','ddr5','disturbance']);
