<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The memory system, end to end</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f2f0e9; --panel:#fbfaf6; --sunk:#e9e5db; --tx:#171714; --tx2:#56544c; --tx3:#858177;
  --bd:#d6d0c3; --bd2:#b6afa1; --wire:#9e988c;
  --a1:#c95632; --a1bg:#f8e4db;   /* tag / stores / writeback */
  --a2:#08785d; --a2bg:#dcefe8;   /* index / fills / L1 */
  --a3:#6655bf; --a3bg:#e9e5f8;   /* offset / ROB */
  --a4:#2467a8; --a4bg:#dce8f4;   /* data / loads */
  --ok:#24783a; --okbg:#deeedf; --bad:#b93931; --badbg:#f6dfdc;
  --act:#d86a16; --actbg:#fae8d6;
  --mono:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101114; --panel:#17181c; --sunk:#0d0e11; --tx:#f0eee8; --tx2:#aaa79f; --tx3:#74716a;
    --bd:#292b31; --bd2:#41444c; --wire:#5e6169;
    --a1:#f08a61; --a1bg:#382017; --a2:#4bcaa1; --a2bg:#102e28; --a3:#ad9bf7; --a3bg:#241e3d;
    --a4:#79afe8; --a4bg:#17283a; --ok:#70cd7c; --okbg:#15301b; --bad:#ff7c70; --badbg:#391816;
    --act:#ff9a3d; --actbg:#35220f;
  }
}
:root[data-theme="dark"]{
  --bg:#101114; --panel:#17181c; --sunk:#0d0e11; --tx:#f0eee8; --tx2:#aaa79f; --tx3:#74716a;
  --bd:#292b31; --bd2:#41444c; --wire:#5e6169;
  --a1:#f08a61; --a1bg:#382017; --a2:#4bcaa1; --a2bg:#102e28; --a3:#ad9bf7; --a3bg:#241e3d;
  --a4:#79afe8; --a4bg:#17283a; --ok:#70cd7c; --okbg:#15301b; --bad:#ff7c70; --badbg:#391816;
  --act:#ff9a3d; --actbg:#35220f;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 60px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
code,.mono{font-family:var(--mono);font-size:.9em}
button{font:500 13px var(--sans);padding:8px 12px;border-radius:8px;border:1px solid var(--bd2);background:var(--panel);color:var(--tx);cursor:pointer}
button:hover{border-color:var(--tx3)}
button:active{transform:scale(.98)}
button:disabled{opacity:.4;cursor:default;transform:none}
button.pri{border-color:var(--act);color:var(--act)}
button.on{background:var(--actbg);border-color:var(--act);color:var(--act)}
input,select{font:13px var(--mono);padding:7px 9px;border:1px solid var(--bd2);border-radius:7px;background:var(--sunk);color:var(--tx);min-width:0}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--bd);padding-top:env(safe-area-inset-top,0px)}
.topin{max-width:1320px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:12px}
.brand{font-weight:600;font-size:15px;white-space:nowrap}
.brand small{display:block;font-weight:400;font-size:11.5px;color:var(--tx3)}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;padding:2px 0}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;font-size:12.5px;color:var(--tx2);text-decoration:none;padding:6px 10px;border-radius:7px;border:1px solid transparent;white-space:nowrap}
.nav a b{font-family:var(--mono);font-weight:500;color:var(--tx3);margin-right:5px;font-size:11px}
.nav a:hover{border-color:var(--bd)}
.nav a.cur{background:var(--panel);border-color:var(--bd2);color:var(--tx)}
.nav a.cur b{color:var(--act)}
.cfgbtn{flex:none}

.wrap{max-width:1320px;margin:0 auto;padding:22px 14px 60px}
.ch{display:none}
.ch.show{display:block}
.chh{margin-bottom:16px}
.chh .num{font-family:var(--mono);font-size:12px;color:var(--act);letter-spacing:.06em}
.chh h1{font-size:25px;font-weight:600;margin:2px 0 6px;letter-spacing:-.01em}
.chh p{margin:0;color:var(--tx2);max-width:880px}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:14px 16px}
.card h3{font-size:14px;font-weight:600;margin:0 0 8px}
.card p{margin:0 0 8px;font-size:14px;color:var(--tx2)}
.card p:last-child{margin-bottom:0}
.card b{color:var(--tx);font-weight:600}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:860px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.stack>*+*{margin-top:12px}
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--panel);border:1px solid var(--bd);border-radius:12px}
.scroller svg{display:block;width:100%;height:auto}
.note{font-size:12.5px;color:var(--tx3)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;border:1px solid var(--bd);color:var(--tx2);vertical-align:1px}
.tag.ok{background:var(--okbg);color:var(--ok);border-color:transparent}
.tag.bad{background:var(--badbg);color:var(--bad);border-color:transparent}
.tag.act{background:var(--actbg);color:var(--act);border-color:transparent}
.tag.pub{background:var(--sunk);color:var(--tx3)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.kv dt{color:var(--tx3)}
.kv dd{margin:0;font-family:var(--mono);font-size:12.5px}

/* ---------- glossary term ---------- */
dfn{font-style:normal;border-bottom:1px dotted var(--tx3);cursor:help}
dfn:hover{border-bottom-color:var(--act);color:var(--tx)}
.pop{position:fixed;z-index:60;max-width:360px;background:var(--panel);border:1px solid var(--bd2);border-radius:10px;padding:10px 12px;font-size:13px;box-shadow:0 8px 28px rgba(0,0,0,.18);display:none}
.pop b{display:block;font-size:13.5px;margin-bottom:3px}
.pop p{margin:0;color:var(--tx2)}

/* ---------- stepper ---------- */
.stp{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stp .cnt{font-family:var(--mono);font-size:12px;color:var(--tx3);min-width:64px;text-align:center}
.stp .grow{flex:1}
.pills{display:flex;flex-wrap:wrap;gap:4px}
.pill{font-size:11px;padding:2px 8px;border-radius:6px;border:1px solid var(--bd);color:var(--tx3);cursor:pointer;background:transparent}
.pill.done{color:var(--tx2)}
.pill.cur{background:var(--actbg);color:var(--act);border-color:var(--act)}
.narr{border-left:3px solid var(--act);padding:10px 14px;background:var(--panel);border-radius:0 10px 10px 0;border-top:1px solid var(--bd);border-right:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.narr h4{margin:0 0 4px;font-size:15px;font-weight:600}
.narr p{margin:0;font-size:14px;color:var(--tx2)}
.narr p+p{margin-top:6px}
.narr b{color:var(--tx);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--bd2);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;border-radius:0;border-right:1px solid var(--bd);padding:7px 11px;background:var(--panel)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--actbg);color:var(--act)}

/* ---------- config drawer ---------- */
.drawer{position:fixed;inset:0;z-index:70;display:none;background:rgba(0,0,0,.35)}
.drawer.show{display:block}
.drawer .in{position:absolute;right:0;top:0;bottom:0;width:min(420px,100%);background:var(--panel);border-left:1px solid var(--bd);padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 18px);overflow:auto}
.drawer h2{font-size:17px;margin:0 0 6px}
.drawer label{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;font-size:13px;margin:8px 0}
.drawer label span small{display:block;color:var(--tx3);font-size:11.5px}

/* ---------- svg common ---------- */
svg text{font-family:var(--sans);fill:var(--tx2);font-size:12px}
svg .h{fill:var(--tx);font-weight:600;font-size:13px}
svg .s{fill:var(--tx3);font-size:10.5px}
svg .m{font-family:var(--mono)}
svg .box{fill:var(--panel);stroke:var(--bd2);stroke-width:1.1}
svg .sunk{fill:var(--sunk);stroke:var(--bd);stroke-width:1}
svg .wire{stroke:var(--wire);stroke-width:1.3;fill:none}
svg .bus{stroke:var(--wire);stroke-width:3;fill:none}
svg .on.box,svg .on .box{stroke:var(--act);stroke-width:2;fill:var(--actbg)}
svg .on.wire,svg .on .wire{stroke:var(--act);stroke-width:2.4}
svg .on.bus,svg .on .bus{stroke:var(--act);stroke-width:4}
svg .okb{fill:var(--okbg);stroke:var(--ok);stroke-width:1.8}
svg .badb{fill:var(--badbg);stroke:var(--bad);stroke-width:1.8}
svg .a1b{fill:var(--a1bg);stroke:var(--a1);stroke-width:1.2}
svg .a2b{fill:var(--a2bg);stroke:var(--a2);stroke-width:1.2}
svg .a3b{fill:var(--a3bg);stroke:var(--a3);stroke-width:1.2}
svg .a4b{fill:var(--a4bg);stroke:var(--a4);stroke-width:1.2}
svg .dim{opacity:.35}
svg .flow{fill:none;stroke-width:3;stroke-dasharray:7 5}
@media (prefers-reduced-motion:no-preference){ svg .flow{animation:dash .9s linear infinite} }
@keyframes dash{to{stroke-dashoffset:-24}}
svg .click{cursor:pointer}
svg .click:hover .box{stroke:var(--act)}

.c2u{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:12px}
@media (max-width:860px){.c2u{grid-template-columns:minmax(0,1fr)}}
.src{font:12.5px/1.75 var(--mono);background:var(--sunk);border-radius:8px;padding:8px 0;overflow-x:auto}
.src .ln{padding:0 10px;white-space:nowrap;cursor:pointer;border-left:3px solid transparent}
.src .ln:hover{background:color-mix(in srgb,var(--act) 8%,transparent)}
.src .ln.hl{background:var(--actbg)}
.src .ln.sel{background:var(--actbg);border-left-color:var(--act)}
.src .no{display:inline-block;width:26px;color:var(--tx3);user-select:none}
.src .bytes{display:inline-block;width:200px;color:var(--a1)}
.src .ins{color:var(--tx)}
.src .lab{color:var(--a3);padding-left:0;margin-top:2px}
svg .bc{fill:var(--a4bg);stroke:var(--a4);stroke-width:1}
svg .bc.bsel{fill:var(--actbg);stroke:var(--act);stroke-width:2}
.bstream{display:flex;flex-wrap:wrap;gap:3px;font:12.5px var(--mono);margin:6px 0 10px}
.bstream span{padding:2px 5px;border-radius:4px;background:var(--sunk)}
.bstream em{font-style:normal;display:inline-flex;gap:3px;padding:2px;border-radius:6px;margin-right:6px}
.bstream em.g0{background:var(--a4bg)}.bstream em.g1{background:var(--a2bg)}
.bstream em span{background:transparent}
.fields{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.fld{border:1.5px solid;border-radius:8px;padding:4px 10px;text-align:center}
.fld code{display:block;font-size:14px;font-weight:600}
.fld span{font-size:11px}
.fld.a1{border-color:var(--a1);background:var(--a1bg);color:var(--a1)}
.fld.a2{border-color:var(--a2);background:var(--a2bg);color:var(--a2)}
.fld.a3{border-color:var(--a3);background:var(--a3bg);color:var(--a3)}
.fld.a4{border-color:var(--a4);background:var(--a4bg);color:var(--a4)}
.fld.act{border-color:var(--act);background:var(--actbg);color:var(--act)}
.bitrow{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 10px}
.bg{text-align:center}
.bb{display:flex;gap:2px}
.bb i{font:600 13px var(--mono);font-style:normal;width:20px;height:24px;line-height:24px;border:1px solid var(--bd2);border-radius:4px;background:var(--sunk)}
.bl{font-size:11px;color:var(--tx3);margin-top:2px}
.bv{font:12px var(--mono);color:var(--act)}
.unote{font-family:var(--sans)!important;color:var(--tx3);font-size:12px!important;padding-top:0!important}
.route{margin:0;padding-left:0;list-style:none;font-size:14px;color:var(--tx2)}
.route li{margin:5px 0}
.route b{font-family:var(--mono);color:var(--act);margin-right:6px}

.mt{border-collapse:collapse;width:100%;font-size:12.5px}
.mt th{text-align:left;font-weight:600;color:var(--tx3);font-size:11px;padding:3px 6px;border-bottom:1px solid var(--bd)}
.mt td{padding:3px 6px;border-bottom:1px solid var(--bd);font-family:var(--mono);font-size:12px}
.mt tr:last-child td{border-bottom:0}
.mt tr.chg td{background:var(--actbg);color:var(--act)}
.mt td dfn{font-family:var(--sans)}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.pgrid{grid-template-columns:minmax(0,1fr)}}
.pp h3{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lane{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:4px 0;font-size:12px}
.lane>span{font:600 11px var(--mono);color:var(--tx3);width:26px}
.lane i{font:normal 11.5px var(--mono);padding:1px 6px;border-radius:5px;background:var(--a4bg);color:var(--a4)}
.lane em{font-style:normal;color:var(--tx3);font-size:11.5px}
.prfg{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:3px}
.pr{border:1px solid var(--bd);border-radius:5px;padding:2px 4px;font-size:10.5px;line-height:1.25;min-height:32px}
.pr b{display:block;font:600 10px var(--mono);color:var(--tx3)}
.pr span{font-family:var(--mono)}
.pr.free{opacity:.35}
.pr.pend{border:1.5px dashed var(--a4);background:var(--a4bg)}
.pr.rdy{background:var(--okbg);border-color:var(--ok)}
.pr.nw{outline:2px solid var(--act)}
.su{display:flex;gap:4px;align-items:center;font-size:12px;margin:3px 0;flex-wrap:wrap}
.su b{font:600 11.5px var(--mono);min-width:56px}
.su span{font:11px var(--mono);padding:0 5px;border-radius:4px}
.su span.r{background:var(--okbg);color:var(--ok)}
.su span.n{background:var(--sunk);color:var(--tx3)}
.evl{margin:0;padding-left:18px;font-size:13.5px;color:var(--tx2)}
.evl li{margin:3px 0}
.evl b{color:var(--tx);font-family:var(--mono);font-size:12.5px}
.ring{width:100%;max-width:280px;display:block;margin:0 auto}
.gantt-w{overflow:auto;max-height:560px;border:1px solid var(--bd);border-radius:8px}
.gantt{border-collapse:separate;border-spacing:0;font:10.5px var(--mono)}
.gantt th{position:sticky;top:0;background:var(--panel);z-index:2;font-weight:500;color:var(--tx3);padding:3px 2px;min-width:24px;cursor:pointer;border-bottom:1px solid var(--bd);white-space:nowrap}
.gantt td{padding:1px 2px;text-align:center;min-width:24px;height:18px;border-right:1px solid color-mix(in srgb,var(--bd) 45%,transparent)}
.gantt .lbl{position:sticky;left:0;background:var(--panel);z-index:1;text-align:left;padding:1px 8px;min-width:70px;border-right:1px solid var(--bd)}
.gantt thead .lbl{z-index:3}
.gantt td.fe{background:var(--a4bg);color:var(--a4)}
.gantt td.uq{background:var(--sunk);color:var(--tx3)}
.gantt td.rn{background:var(--a3bg);color:var(--a3)}
.gantt td.wt{color:var(--tx3)}
.gantt td.is{background:var(--actbg);color:var(--act);font-weight:600}
.gantt td.ex{background:var(--a2bg);color:var(--a2)}
.gantt td.mm{background:var(--a4bg);color:var(--a4);font-weight:600}
.gantt td.ms{background:var(--badbg);color:var(--bad)}
.gantt td.wb{background:var(--okbg);color:var(--ok)}
.gantt td.rt{background:var(--a3);color:#fff;font-weight:600}
.gantt td.sb{background:var(--a1bg);color:var(--a1)}
.gantt td.cm{background:var(--a1);color:#fff;font-weight:600}
.gantt td.xx{background:var(--badbg);color:var(--bad);font-weight:700}
.gantt td.fut{background:transparent!important;color:transparent!important}
.gantt td.cur,.gantt th.cur{box-shadow:inset 2px 0 0 var(--act),inset -2px 0 0 var(--act)}
.gantt tr.sqd td.lbl{color:var(--bad);text-decoration:line-through}
.gantt tr.act td.lbl{color:var(--act);font-weight:600}
svg .slot{fill:var(--sunk);stroke:var(--bd);stroke-width:1}
svg .slot.wait{fill:var(--a4bg);stroke:var(--a4)}
svg .slot.rdy{fill:var(--okbg);stroke:var(--ok)}
svg .slot.exec{fill:var(--actbg);stroke:var(--act)}
svg .slot.done{fill:var(--okbg);stroke:var(--ok)}
svg .slot.miss{fill:var(--badbg);stroke:var(--bad)}
svg .slot.sen{fill:var(--a3bg);stroke:var(--a3)}
svg .slt{font-size:9px;fill:var(--tx)}

.kchain{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:900px){.kchain{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kchain>div{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;background:var(--sunk);position:relative}
.kchain>div.on{border-color:var(--act);background:var(--actbg)}
.kchain code{font-size:12px;font-weight:600;color:var(--tx)}
.kchain span{display:block;font:11px var(--mono);color:var(--tx3)}
.kchain p{margin:4px 0 0;font-size:12.5px;color:var(--tx2)}

.cohbtns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:760px){.cohbtns{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cohbtns>div{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.cohbtns>div b{width:100%;font-size:12.5px}
.cohbtns button{padding:5px 8px;font-size:12px}

.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.glist .card h3{margin-bottom:4px}
button.lnk{padding:3px 8px;font-size:11.5px}

/* ========================================================================== */
/* Experience layer — intentionally separate from chapter simulation styling. */
/* ========================================================================== */

:root{
  --sidebar-w:248px;
  --topbar-h:58px;
  --content-max:1560px;
  --radius-sm:7px;
  --radius-md:10px;
  --radius-lg:14px;
  --shadow-float:0 18px 55px rgba(28,27,24,.14),0 3px 12px rgba(28,27,24,.08);
  --focus:0 0 0 3px color-mix(in srgb,var(--act) 28%,transparent);
  --panel-hi:color-mix(in srgb,var(--panel) 88%,var(--bg));
}

html{scroll-behavior:smooth;scroll-padding-top:calc(var(--topbar-h) + 22px)}
body{font-size:15.5px;line-height:1.62;letter-spacing:-.003em;overflow-x:hidden}
body.nav-open,body.viz-open{overflow:hidden}
::selection{background:color-mix(in srgb,var(--act) 28%,transparent)}

/* ----- shell ----- */
.app-shell{min-height:100vh}
.sidebar{
  position:fixed;inset:0 auto 0 0;width:var(--sidebar-w);z-index:45;
  display:flex;flex-direction:column;background:var(--panel);
  border-right:1px solid var(--bd);padding:18px 14px 14px;
}
.sidebar-brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--tx);padding:4px 8px 18px}
.sidebar-mark{width:34px;height:34px;border:1px solid var(--bd2);border-radius:9px;display:grid;place-items:center;font:700 11px var(--mono);letter-spacing:-.04em;background:var(--sunk);color:var(--act)}
.sidebar-brand strong{display:block;font-size:14px;line-height:1.2;letter-spacing:-.015em}
.sidebar-brand small{display:block;margin-top:3px;color:var(--tx3);font-size:10.5px;line-height:1.2;font-family:var(--mono)}
.sidebar-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:3px 4px 12px;scrollbar-width:thin;scrollbar-color:var(--bd2) transparent}
.nav{display:flex;flex-direction:column;gap:2px;overflow:visible;padding:0}
.nav-group{margin:14px 8px 5px;color:var(--tx3);font:600 9.5px/1 var(--mono);text-transform:uppercase;letter-spacing:.11em}
.nav-group:first-child{margin-top:4px}
.nav a{display:grid;grid-template-columns:27px minmax(0,1fr) 14px;align-items:center;gap:7px;min-height:38px;padding:7px 8px;border:0;border-radius:8px;color:var(--tx2);text-decoration:none;white-space:normal;transition:background .14s ease,color .14s ease,transform .14s ease}
.nav a:hover{background:var(--sunk);color:var(--tx);border:0;transform:translateX(1px)}
.nav a.cur{background:var(--actbg);border:0;color:var(--tx)}
.nav-num{font:600 10.5px var(--mono);color:var(--tx3)}
.nav a.cur .nav-num{color:var(--act)}
.nav-label{font-size:12.5px;line-height:1.2;font-weight:520;letter-spacing:-.005em}
.nav-arrow{opacity:0;color:var(--act);transform:translateX(-3px);transition:opacity .14s,transform .14s}
.nav a.cur .nav-arrow{opacity:1;transform:none}
.sidebar-footer{border-top:1px solid var(--bd);padding:12px 5px 0;display:grid;gap:8px}
.machine-meta{padding:0 4px 3px;color:var(--tx3);font:10.5px/1.35 var(--mono)}
.side-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.side-actions button{justify-content:center}
.side-scrim{display:none}

.app-stage{min-height:100vh;margin-left:var(--sidebar-w)}
.top{position:sticky;top:0;z-index:35;height:var(--topbar-h);padding:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px) saturate(1.15);-webkit-backdrop-filter:blur(16px) saturate(1.15);border-bottom:1px solid color-mix(in srgb,var(--bd) 82%,transparent)}
.topin{max-width:none;height:100%;margin:0;padding:0 24px;display:flex;align-items:center;gap:12px}
.nav-toggle{display:none}
.crumb{display:flex;align-items:center;gap:10px;min-width:0;color:var(--tx2)}
.crumb-num{font:600 10.5px var(--mono);letter-spacing:.06em;color:var(--act)}
.crumb-title{font-size:12.5px;font-weight:560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb-sep{width:1px;height:14px;background:var(--bd)}
.crumb-context{font:10.5px var(--mono);color:var(--tx3);white-space:nowrap}
.top-spacer{flex:1}
.top-actions{display:flex;align-items:center;gap:6px}
.desktop-only{display:inline-flex}
.mobile-only{display:none!important}

.wrap{max-width:var(--content-max);margin:0 auto;padding:38px 34px 96px}
.ch{display:none;animation:chapter-in .2s ease-out backwards}
.ch.show{display:block}
@keyframes chapter-in{from{opacity:.55;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ----- chapter header ----- */
.chh{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:end;margin:0 0 34px;padding:0 0 26px;border-bottom:1px solid var(--bd)}
.ch-copy{min-width:0}
.chh .num{display:flex;align-items:center;gap:8px;font:600 10.5px var(--mono);color:var(--act);letter-spacing:.09em;text-transform:uppercase;margin-bottom:8px}
.chh .num::after{content:"";width:28px;height:1px;background:var(--act);opacity:.55}
.chh h1{font-size:clamp(30px,3vw,44px);line-height:1.06;font-weight:650;margin:0 0 10px;letter-spacing:-.035em;max-width:980px}
.chh p{margin:0;color:var(--tx2);max-width:900px;font-size:16px;line-height:1.55}
.ch-nav{display:flex;gap:7px;align-items:center;padding-bottom:2px}
.ch-nav button{min-width:92px}

.stack>*+*{margin-top:20px}
.grid2,.grid3{gap:20px}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}

/* ----- typography / surfaces ----- */
.card{background:var(--panel);border:1px solid var(--bd);border-radius:var(--radius-md);padding:20px 22px;box-shadow:0 1px 0 color-mix(in srgb,var(--tx) 3%,transparent);overflow-wrap:anywhere}
.card h3{font-size:14.5px;font-weight:650;letter-spacing:-.012em;margin:0 0 10px}
.card p{font-size:14.25px;line-height:1.62;color:var(--tx2);margin:0 0 10px}
.card:hover{border-color:color-mix(in srgb,var(--bd2) 78%,var(--bd))}
.note{font-size:12px;line-height:1.5;color:var(--tx3)}
code,.mono{font-size:.9em}
code{background:color-mix(in srgb,var(--sunk) 72%,transparent);padding:.08em .28em;border-radius:4px}
pre code{background:none;padding:0}
.tag{font-size:10px;letter-spacing:.02em;padding:2px 6px;border-radius:5px}

button{min-height:36px;font:560 12.5px var(--sans);padding:7px 11px;border-radius:7px;border:1px solid var(--bd2);background:var(--panel);color:var(--tx);cursor:pointer;transition:border-color .14s,background .14s,color .14s,transform .08s,box-shadow .14s}
button:hover{border-color:var(--tx3);background:var(--panel-hi)}
button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,dfn:focus-visible{outline:none;box-shadow:var(--focus)}
button.pri{background:var(--tx);color:var(--bg);border-color:var(--tx)}
button.pri:hover{background:color-mix(in srgb,var(--tx) 88%,var(--bg));color:var(--bg)}
button.on{background:var(--actbg);border-color:color-mix(in srgb,var(--act) 65%,var(--bd));color:var(--act)}
button.ghost{border-color:transparent;background:transparent;color:var(--tx2)}
button.ghost:hover{background:var(--sunk);color:var(--tx)}
.iconbtn{width:36px;padding:0;display:inline-grid;place-items:center;font-family:var(--mono);font-size:15px}
input,select{min-height:38px;padding:7px 10px;border-radius:7px;background:var(--panel);border-color:var(--bd2)}

/* ----- interactive visual canvases ----- */
.viz-frame{position:relative;border:1px solid var(--bd);border-radius:var(--radius-lg);background:var(--panel);overflow:hidden;box-shadow:0 1px 0 color-mix(in srgb,var(--tx) 3%,transparent)}
.viz-bar{height:42px;display:flex;align-items:center;gap:8px;padding:0 9px 0 13px;border-bottom:1px solid var(--bd);background:color-mix(in srgb,var(--panel) 96%,var(--bg));user-select:none}
.viz-hint{font:10.5px var(--mono);color:var(--tx3);white-space:nowrap}
.viz-hint strong{color:var(--tx2);font-weight:600}
.viz-bar .grow{flex:1}
.viz-bar button{min-height:28px;height:28px;min-width:28px;padding:0 8px;background:transparent;border-color:transparent;font-size:11.5px}
.viz-bar button:hover{background:var(--sunk);border-color:transparent}
.viz-pan{display:flex;gap:1px}
.viz-frame .scroller{border:0!important;border-radius:0!important;background:var(--panel);overflow:auto;overscroll-behavior-x:contain;scrollbar-width:thin;scrollbar-color:var(--bd2) transparent;cursor:grab;position:relative}
.viz-frame .scroller.dragging{cursor:grabbing;user-select:none}
.viz-frame .scroller::-webkit-scrollbar{height:10px;width:10px}
.viz-frame .scroller::-webkit-scrollbar-thumb{background:var(--bd2);border:3px solid var(--panel);border-radius:20px}
.viz-frame .scroller::-webkit-scrollbar-track{background:var(--panel)}
.viz-frame .scroller svg{display:block;height:auto;max-width:none;transition:width .16s ease}
.viz-frame::before,.viz-frame::after{content:"";position:absolute;z-index:4;top:42px;bottom:10px;width:26px;pointer-events:none;opacity:0;transition:opacity .15s}
.viz-frame::before{left:0;background:linear-gradient(90deg,color-mix(in srgb,var(--panel) 94%,transparent),transparent)}
.viz-frame::after{right:0;background:linear-gradient(270deg,color-mix(in srgb,var(--panel) 94%,transparent),transparent)}
.viz-frame.can-left::before,.viz-frame.can-right::after{opacity:1}
.viz-frame.is-fullscreen{position:fixed;inset:14px;z-index:120;background:var(--bg);border-color:var(--bd2);box-shadow:var(--shadow-float);display:flex;flex-direction:column}
.viz-frame.is-fullscreen .viz-bar{flex:none}
.viz-frame.is-fullscreen .scroller{flex:1;min-height:0}
.viz-frame.is-fullscreen::before,.viz-frame.is-fullscreen::after{top:42px}

/* legacy bare scrollers that are not SVG canvases */
.scroller{border-radius:var(--radius-md);border-color:var(--bd);background:var(--panel)}

/* ----- steppers ----- */
.stepper{gap:0!important;border:1px solid var(--bd);border-radius:var(--radius-md);background:var(--panel);overflow:hidden}
.stepper>*+*{margin-top:0!important}
.stepper-bar{position:sticky;top:calc(var(--topbar-h) + 8px);z-index:12;display:grid;grid-template-columns:auto auto auto auto minmax(80px,1fr);gap:6px;padding:9px 10px;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
.stepper-bar .grow{display:none}
.stepper-bar .pills{min-width:0;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;justify-content:flex-end;padding:1px 0}
.stepper-bar .pills::-webkit-scrollbar{display:none}
.stepper .pill{flex:none;min-height:26px;padding:3px 8px;border-radius:5px;font:600 10px var(--mono);background:transparent}
.stepper .pill.done{color:var(--tx3);border-color:transparent}
.stepper .pill.cur{background:var(--actbg);color:var(--act);border-color:color-mix(in srgb,var(--act) 45%,var(--bd))}
.step-progress{height:2px;background:var(--bd);position:relative}
.step-progress>i{position:absolute;inset:0 auto 0 0;background:var(--act);width:0;transition:width .16s ease}
.narr{border:0;border-radius:0;padding:17px 20px 18px;background:color-mix(in srgb,var(--actbg) 28%,var(--panel));position:relative}
.narr::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--act)}
.narr h4{font-size:15px;letter-spacing:-.012em;margin:0 0 5px}
.narr p{font-size:14px;line-height:1.58}

/* custom non-stepper control rows */
.stp{gap:8px}
.seg{border-radius:7px;flex-wrap:nowrap;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{white-space:nowrap;min-height:36px;padding:7px 11px}

/* ----- tables / dense data ----- */
.mt{font-size:12.5px}
.mt th{padding:8px 9px;font-size:10.5px;letter-spacing:.035em;text-transform:uppercase;background:color-mix(in srgb,var(--sunk) 55%,transparent);position:sticky;top:0}
.mt td{padding:7px 9px;font-size:11.5px}
.mt tr:hover td{background:color-mix(in srgb,var(--sunk) 45%,transparent)}
.kv{gap:5px 16px;font-size:13px}
.kv dt{font-size:12px}

/* ----- glossary / popovers / drawer ----- */
dfn{border-bottom-color:color-mix(in srgb,var(--act) 48%,var(--tx3));text-decoration:none;border-bottom-style:dotted;border-bottom-width:1px;cursor:pointer}
dfn:hover,dfn:focus-visible{color:var(--act);border-bottom-color:var(--act)}
.pop{max-width:390px;border-radius:9px;padding:13px 14px;box-shadow:var(--shadow-float);font-size:13px}
.pop b{font-size:13.5px}
.drawer{background:rgba(15,15,16,.38);backdrop-filter:blur(2px)}
.drawer .in{width:min(460px,100%);padding:28px 26px;background:var(--panel);box-shadow:-22px 0 60px rgba(0,0,0,.14)}
.drawer h2{font-size:23px;letter-spacing:-.025em;margin-bottom:8px}
.drawer label{grid-template-columns:minmax(0,1fr) 112px;gap:14px;padding:10px 0;margin:0;border-bottom:1px solid var(--bd)}
.drawer label:last-of-type{border-bottom:0}

/* ----- chapter-specific density corrections ----- */
.c2u{gap:20px;grid-template-columns:minmax(0,.9fr) minmax(0,1.35fr)}
.src{font-size:12.5px;line-height:1.9;border-radius:7px;padding:10px 0}
.src .ln{padding:1px 12px}
.fields{gap:8px}
.fld{padding:6px 11px;border-radius:7px}

.pgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.pp{min-width:0}
.prfg{grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:4px}
.pr{min-height:36px;padding:4px 5px}
.gantt-w{max-height:68vh;border-radius:8px;scrollbar-width:thin}
.gantt th,.gantt td{min-width:27px}
.ring{max-width:320px}
.pctl{position:sticky;top:calc(var(--topbar-h) + 8px);z-index:11;box-shadow:0 7px 22px color-mix(in srgb,var(--bg) 80%,transparent)}

.kchain{gap:10px}
.kchain>div{border-radius:8px;padding:11px 12px}
.cohbtns{gap:10px}
.glist{grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.glist .card{min-height:100%}

/* ----- SVG refinement ----- */
svg text{font-size:12px}
svg .h{font-size:13px;font-weight:650}
svg .s{font-size:10.5px}
svg .box{stroke-width:1}
svg .wire{stroke-width:1.2}
svg .click:hover .box{stroke-width:1.7}

/* ----- responsive ----- */
@media (max-width:1180px){
  :root{--sidebar-w:224px}
  .wrap{padding-left:24px;padding-right:24px}
  .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

@media (max-width:900px){
  :root{--sidebar-w:272px;--topbar-h:56px}
  .sidebar{transform:translateX(-102%);transition:transform .2s ease;box-shadow:20px 0 50px rgba(0,0,0,.16)}
  body.nav-open .sidebar{transform:none}
  .side-scrim{display:block;position:fixed;inset:0;z-index:44;background:rgba(0,0,0,.34);opacity:0;pointer-events:none;transition:opacity .2s}
  body.nav-open .side-scrim{opacity:1;pointer-events:auto}
  .app-stage{margin-left:0}
  .nav-toggle{display:inline-grid}
  .mobile-only{display:inline-flex!important}
  .desktop-only{display:none!important}
  .topin{padding:0 14px}
  .crumb-context,.crumb-sep{display:none}
  .wrap{padding:28px 18px 82px}
  .chh{grid-template-columns:1fr;gap:18px;margin-bottom:26px;padding-bottom:22px}
  .chh h1{font-size:clamp(29px,8vw,38px)}
  .chh p{font-size:15px}
  .ch-nav{justify-content:flex-start}
  .grid2,.grid3,.c2u,.pgrid{grid-template-columns:minmax(0,1fr)}
  .card{padding:18px}
  .stepper-bar{top:calc(var(--topbar-h) + 6px);grid-template-columns:auto auto auto auto;align-items:center}
  .stepper-bar .pills{grid-column:1/-1;justify-content:flex-start;border-top:1px solid var(--bd);padding-top:7px;margin-top:2px}
  .pctl{top:calc(var(--topbar-h) + 6px)}
  .viz-hint .drag-copy{display:none}
}

@media (max-width:620px){
  .wrap{padding:22px 12px 72px}
  .top-actions button{padding:0;width:34px}
  .top-actions .btn-label{display:none}
  .chh{margin-bottom:22px}
  .chh h1{font-size:30px;line-height:1.08}
  .chh p{font-size:14.5px}
  .ch-nav{display:grid;grid-template-columns:1fr 1fr;width:100%}
  .ch-nav button{min-width:0}
  .card{padding:16px;border-radius:9px}
  .stack>*+*{margin-top:14px}
  .grid2,.grid3{gap:14px}
  button{min-height:40px}
  .stp:not(.stepper-bar){align-items:stretch}
  .stp:not(.stepper-bar)>button{flex:0 0 auto}
  .seg{width:100%}
  .seg button{flex:1 0 auto}
  .drawer .in{padding:22px 18px}
  .drawer label{grid-template-columns:1fr}
  .drawer label input{width:100%}
  .viz-bar{padding-left:10px;gap:4px}
  .viz-hint{font-size:9.5px}
  .viz-pan{display:none}
  .viz-frame.is-fullscreen{inset:0;border:0;border-radius:0}
  .kchain{grid-template-columns:minmax(0,1fr)}
  .cohbtns{grid-template-columns:minmax(0,1fr)}
  .glist{grid-template-columns:minmax(0,1fr)}
  .mt{min-width:520px}
  .card:has(> .mt),.card:has(> table.mt){overflow-x:auto}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ========================================================================== */
/* V2 art direction + information architecture cleanup                        */
/* ========================================================================== */

:root{
  --topbar-h:0px;
  --content-max:1640px;
  --radius-sm:5px;
  --radius-md:7px;
  --radius-lg:9px;
  --rail:color-mix(in srgb,var(--panel) 82%,var(--bg));
  --canvas-grid:color-mix(in srgb,var(--bd) 22%,transparent);
  --ink-panel:#171719;
  --ink-panel-2:#1e2023;
  --ink-text:#f4f1e9;
  --ink-muted:#aaa69c;
  --signal:#ff7a1a;
}

body{
  background-color:var(--bg);
  background-image:
    linear-gradient(var(--canvas-grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--canvas-grid) 1px,transparent 1px);
  background-size:32px 32px;
  background-attachment:fixed;
}

/* Desktop has one navigation/control rail. The top bar is mobile-only. */
.top{display:none}
.sidebar{background:var(--rail);padding:20px 14px 14px}
.sidebar-brand{padding:4px 8px 20px}
.sidebar-mark{
  border-radius:6px;background:var(--ink-panel);border-color:var(--ink-panel);
  color:#ffb24d;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)
}
.sidebar-brand strong{font-size:14.5px;font-weight:680}
.sidebar-brand small{font-size:10px;letter-spacing:.01em}
.nav-group{margin-top:18px}
.nav a{border-radius:5px;min-height:40px}
.nav a:hover{transform:none;background:color-mix(in srgb,var(--sunk) 75%,transparent)}
.nav a.cur{background:var(--ink-panel);color:var(--ink-text)}
.nav a.cur .nav-num,.nav a.cur .nav-arrow{color:#ffad45}
.nav a.cur .nav-label{color:var(--ink-text)}
.sidebar-footer{padding-top:14px}
.side-actions button{min-height:34px;border-radius:5px}
.app-stage{background:color-mix(in srgb,var(--bg) 92%,transparent)}
.wrap{padding:54px 42px 110px}

/* Editorial chapter opening: one owner for chapter identity, no duplicate nav. */
.chh{
  display:block;margin:0 0 46px;padding:0;border:0;
  max-width:1180px;
}
.chh.has-art{
  max-width:none;display:grid;grid-template-columns:minmax(0,1.18fr) minmax(340px,.82fr);
  gap:64px;align-items:center;min-height:250px;padding:18px 0 34px;
  border-bottom:1px solid var(--bd)
}
.chh .num{font-size:10px;letter-spacing:.13em;margin-bottom:13px}
.chh .num::after{width:38px}
.chh h1{font-size:clamp(42px,4.2vw,68px);line-height:.98;font-weight:720;letter-spacing:-.055em;margin-bottom:16px}
.chh p{font-size:17px;line-height:1.55;max-width:860px;color:var(--tx2)}

/* Signature chapter art is derived from the hardware itself, not stock imagery. */
.chapter-art{
  position:relative;overflow:hidden;min-height:220px;border-radius:10px;
  background:var(--ink-panel);color:var(--ink-text);border:1px solid #292b2f;
  box-shadow:0 22px 60px rgba(26,25,22,.15)
}
.chapter-art::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);
  background-size:24px 24px
}
.art-cap{position:absolute;left:18px;top:15px;font:700 9px var(--mono);letter-spacing:.12em;color:#8f9198}

.art-map{padding:62px 22px 22px;display:flex;flex-direction:column;justify-content:center}
.art-path{position:relative;z-index:1;display:grid;grid-template-columns:1.2fr auto .8fr auto .8fr auto .8fr auto 1.1fr;align-items:center;gap:8px}
.art-path i{font:700 11px var(--mono);font-style:normal;text-align:center;padding:15px 8px;border:1px solid #3b3e43;background:#202226;border-radius:4px;color:#d8d7d2}
.art-path i.ap-core{border-color:#735021;color:#ffb24d}.art-path i.ap-dram{border-color:#315f55;color:#66d7b4}
.art-path b{font:400 13px var(--mono);color:#5d6066}
.art-address{position:relative;z-index:1;margin-top:18px;padding-top:14px;border-top:1px solid #2d3035;font:11px var(--mono);color:#9fa1a6}
.art-address span{color:#ff9b3f;margin:0 7px}
.art-grid{position:absolute;width:150px;height:150px;right:-50px;bottom:-65px;border:1px solid rgba(255,153,61,.25);transform:rotate(45deg)}

.art-core{padding:58px 20px 20px}
.pipe-row{position:relative;z-index:1;display:grid;grid-template-columns:62px repeat(6,1fr);gap:5px;align-items:center;margin:8px 0}
.pipe-row span{font:700 9px var(--mono);letter-spacing:.05em;color:#81848b}
.pipe-row i{height:17px;border:1px solid #36393f;background:#202226;border-radius:2px}
.pipe-row i.hot{border-color:#a55b1d;background:#4a2d16;box-shadow:0 0 18px rgba(255,122,26,.16)}
.pipe-row i.ready{border-color:#236951;background:#173c32}
.art-cycle{position:absolute;left:20px;right:20px;bottom:15px;padding-top:10px;border-top:1px solid #2c2f34;font:10px var(--mono);color:#7f8289}
.art-cycle b{color:#ffad45;font-weight:700}

.art-l1d{padding:58px 18px 18px}
.cache-address{position:relative;z-index:1;display:grid;grid-template-columns:1.5fr .8fr .7fr;border:1px solid #383b40;border-radius:4px;overflow:hidden}

.cache-address span:nth-child(2){color:#64d7ad}.cache-address span:nth-child(3){color:#b5a7ff}
.cache-ways{position:relative;z-index:1;display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:13px}
.cache-ways i{min-width:0;padding:8px 3px 7px;border:1px solid #35383d;background:#202226;border-radius:3px;text-align:center;font-style:normal}
.cache-ways b,.cache-ways em{display:block;font:700 8px var(--mono);font-style:normal}.cache-ways b{color:#777a81}.cache-ways em{margin-top:4px;color:#5d6066}
.cache-ways i.hit{background:#19372e;border-color:#2d8b6d;box-shadow:0 0 18px rgba(62,210,165,.12)}
.cache-ways i.hit b,.cache-ways i.hit em{color:#67dcb7}

/* Surfaces: fewer soft cards, more explicit information hierarchy. */
.card{border-radius:var(--radius-md);box-shadow:none;background:color-mix(in srgb,var(--panel) 96%,transparent)}

.grid2,.grid3{gap:24px}

/* Canvas chrome only appears on diagrams large enough to need it. */

.viz-bar{height:38px;padding:0 8px 0 12px;background:color-mix(in srgb,var(--panel) 86%,var(--bg));border-bottom-color:var(--bd)}

.viz-frame.is-fullscreen::before,.viz-frame.is-fullscreen::after{top:38px}

/* Chapter 00: the architecture map is the hero/product, not another card. */
.map-workbench{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px;align-items:start}
.map-workbench .map-viz{min-width:0}
.map-inspector{
  position:sticky;top:78px;min-height:250px;padding:24px;
  background:var(--ink-panel);border-color:#2c2e32;color:var(--ink-text)
}
.map-inspector h3{font-size:22px;line-height:1.15;color:var(--ink-text);letter-spacing:-.03em;margin:6px 0 13px}
.map-inspector p{color:#b4b1a8;font-size:13.5px}.map-inspector .note{color:#7f8187}
.map-inspector button.pri{background:var(--signal);border-color:var(--signal);color:#151515;margin-top:8px}
.inspector-kicker{font:700 9px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#ffad45}
.route-index{background:transparent;border:0;border-top:1px solid var(--bd);border-radius:0;padding:30px 0 0}

.route-index .route li{margin:0;padding:8px 0;border-bottom:1px solid color-mix(in srgb,var(--bd) 68%,transparent)}

/* Chapter 02: simulator first, details on demand. */
.core-intro>.card{background:transparent;border:0;border-top:2px solid var(--bd2);border-radius:0;padding:18px 0 0}
.core-intro>.card:first-child{border-top-color:var(--act)}
.core-controls{border-radius:6px;background:color-mix(in srgb,var(--panel) 94%,var(--bg));top:8px}
.core-viz{border-color:var(--bd2)}
.core-block{cursor:pointer;outline:none}
.core-block:hover .box,.core-block:focus .box{stroke:var(--act);stroke-width:1.8}
.core-events{border-left:3px solid var(--act);border-radius:4px}
.inspector-deck{margin-top:4px;border-top:1px solid var(--bd);padding-top:24px}
.inspector-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:12px}
.inspector-head span{display:block;font:700 9px var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--act);margin-bottom:5px}
.inspector-head strong{font-size:16px;font-weight:620;letter-spacing:-.02em}
.inspector-tabs{display:flex;gap:5px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:thin}
.inspector-tabs button{flex:none;min-height:31px;border-radius:4px;background:transparent;border-color:var(--bd);font-size:11px}
.inspector-tabs button.on{background:var(--ink-panel);color:var(--ink-text);border-color:var(--ink-panel)}
.inspector-tabs .all-state{margin-left:auto}
.pgrid.inspector-mode{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.pgrid.inspector-mode>.pp{display:none;min-height:280px;border-radius:6px}
.pgrid.inspector-mode>.pp.inspector-active{display:block}
.pgrid.inspector-mode.show-all{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.pgrid.inspector-mode.show-all>.pp{display:block;min-height:0}

/* Chapter 04: controls/narration lead, hardware canvas follows. */
.ch-l1d>.chapter-body{display:flex;flex-direction:column}
.l1-intro{order:1}
.l1-intro>.card{background:transparent;border:0;border-top:2px solid var(--bd2);border-radius:0;padding:18px 0 0}

/* Stepper is a transport/control surface, not a card inside a card. */
.stepper{border-radius:6px;background:var(--panel)}

/* Chapter-to-chapter navigation appears once, after the work. */

}

.chapter-jump strong{margin-top:5px;font-size:14px;font-weight:620;color:var(--tx)}
.chapter-jump:hover{background:var(--panel);border-color:var(--bd2)}

/* Dark mode remains a first-class alternate theme, not the default mood. */
:root[data-theme="dark"] body{background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px)}

/* ========================================================================== */

/* ========================================================================== */

:root[data-theme="dark"]{
  --bg:#080b10; --panel:#0f141b; --sunk:#0a0e14; --tx:#f2f5f8; --tx2:#a7b1bd; --tx3:#667484;
  --bd:#202a36; --bd2:#334354; --wire:#53677c;

  --a4:#6fb8ff; --a4bg:#122a40; --ok:#65d77a; --okbg:#102d1a; --bad:#ff746a; --badbg:#351515;
  --act:#ff9f43; --actbg:#34230f;
  --rail:#0b0f15; --canvas-grid:rgba(102,126,151,.08); --ink-panel:#0b0f15; --ink-panel-2:#111821; --ink-text:#f4f7fa; --ink-muted:#8592a0; --signal:#ff9f43;

.concept-disclosure>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px 2px;color:var(--tx2);user-select:none}

.concept-disclosure>summary i{font:400 18px var(--mono);font-style:normal;color:var(--tx3);transition:transform .16s,color .16s}.concept-disclosure[open]>summary i{transform:rotate(45deg);color:var(--act)}
.concept-disclosure>summary+*{margin:5px 0 18px!important}.concept-disclosure .grid2,.concept-disclosure .core-intro{gap:16px}
.concept-disclosure .card{background:rgba(16,22,30,.72)}

/* Rich semantic terms. Color is quiet at rest, explicit on hover/focus. */
dfn[data-g]{--term:#94a3b8;display:inline;border:0;padding:0 .08em;border-radius:3px;color:color-mix(in srgb,var(--term) 84%,var(--tx));background:linear-gradient(180deg,transparent 64%,color-mix(in srgb,var(--term) 16%,transparent) 64%);box-decoration-break:clone;-webkit-box-decoration-break:clone;transition:background .12s,color .12s,box-shadow .12s}
dfn[data-g]:hover,dfn[data-g]:focus-visible{color:#fff;background:color-mix(in srgb,var(--term) 19%,transparent);box-shadow:inset 0 -1px 0 color-mix(in srgb,var(--term) 70%,transparent)}
.term-core{--term:#b29cff!important}.term-xlate{--term:#6fb8ff!important}.term-cache{--term:#43d5a5!important}.term-memory{--term:#22d3ee!important}.term-io{--term:#f5b942!important}.term-order{--term:#fb7185!important}.term-coh{--term:#ff8a4c!important}.term-pref{--term:#c084fc!important}
.gloss-pop{padding:0!important;overflow:hidden;background:#0b1017!important;border-color:#2c3948!important;box-shadow:0 22px 70px rgba(0,0,0,.5)!important}
.term-pop-head{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:9px;padding:13px 14px 11px;border-bottom:1px solid #202b37}.term-pop-head b{margin:0!important;font-size:14px!important;color:#f4f7fa}.term-pop-cat{font:700 8.5px var(--mono);letter-spacing:.09em;text-transform:uppercase;padding:3px 5px;border-radius:3px;background:color-mix(in srgb,var(--term) 18%,transparent);color:var(--term)}
.term-pop-close{width:26px;min-width:26px;height:26px;min-height:26px;padding:0;border:0;background:transparent;color:#748394;font-size:18px}.term-pop-close:hover{background:#151d27;color:#fff}
.gloss-pop>p{padding:12px 14px 14px;margin:0!important;color:#aeb9c5!important;font-size:12.8px;line-height:1.55}
.term-mini{padding:9px 12px 3px;background:#0d131b}.term-mini svg{display:block;width:100%;height:92px}.term-mini rect,.term-mini circle,.term-mini path{fill:#111a24;stroke:#415266;stroke-width:1.4}.term-mini path{fill:none}.term-mini .hot{fill:color-mix(in srgb,var(--mini) 18%,#101720);stroke:var(--mini)}.term-mini text{fill:#d7dee7;font:600 10px var(--mono);text-anchor:middle}.term-mini text.s{fill:#748394;font-size:8px}.term-mini .ring{fill:none;stroke:var(--mini);stroke-width:2}.term-mini .grid path{stroke:#283746}

/* Simulator workbench: controls stay present while the hardware remains large. */
.sim-workbench{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start;margin-top:22px}
.lab-rail{position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--bd2) transparent;padding-right:2px}
.lab-rail>*+*{margin-top:10px!important}
.lab-rail>*{min-width:0}.lab-stage{min-width:0;position:relative}.lab-stage>.viz-frame{margin-top:0!important}
.lab-rail .stepper{border-color:#263342;background:#0c1118}.lab-rail .stepper-bar{position:static!important;background:#101720;grid-template-columns:auto auto auto auto;gap:5px}.lab-rail .stepper-bar .pills{grid-column:1/-1;justify-content:flex-start;border-top:1px solid #243140;padding-top:6px}.lab-rail .narr{padding:15px 16px 16px;background:#0d151d}.lab-rail .narr p{font-size:12.6px}.lab-rail .narr h4{font-size:14px}.scenario-dock{position:sticky;top:0;z-index:4;padding:10px;border:1px solid #263342;border-radius:7px;background:rgba(12,17,24,.96);backdrop-filter:blur(12px)}.scenario-dock>.note{width:100%;font:700 9px var(--mono);letter-spacing:.08em;text-transform:uppercase}.scenario-dock .seg{width:100%}.scenario-dock .seg button{font-size:10.5px;padding-left:7px;padding-right:7px}
.sticky-input{position:sticky;top:0;z-index:5;padding:12px!important;background:rgba(12,17,24,.97)!important;backdrop-filter:blur(14px);border-color:#2b3948!important}.sticky-input>h3{font-size:12px!important;text-transform:uppercase;letter-spacing:.07em;color:#8493a3;margin-bottom:8px!important}.sticky-input .stp{display:grid!important;grid-template-columns:1fr 88px;gap:6px!important}.sticky-input .l1va{grid-column:1/-1;width:100%!important}.sticky-input .l1v{width:100%!important}.sticky-input .l1go{grid-column:1/-1}.sticky-input .l1clr{grid-column:1/-1;background:transparent}.control-help{margin-top:7px}.control-help summary{cursor:pointer;color:var(--tx3);font:600 9.5px var(--mono);text-transform:uppercase;letter-spacing:.05em}.control-help p{margin-top:6px!important;font-size:10.5px!important}.l1err{grid-column:1/-1}

/* Focus cameras: switch what part of a large diagram owns the viewport. */
.focus-strip{position:sticky;top:10px;z-index:10;display:flex;align-items:center;gap:8px;min-height:42px;padding:6px 8px 6px 11px;margin-bottom:7px;border:1px solid #263342;border-radius:7px;background:rgba(10,15,22,.93);backdrop-filter:blur(14px);box-shadow:0 8px 30px rgba(0,0,0,.18)}
.focus-label{flex:none;font:700 8.5px var(--mono);letter-spacing:.11em;text-transform:uppercase;color:#647486}.focus-tabs{display:flex;gap:3px;min-width:0;overflow-x:auto;scrollbar-width:none}.focus-tabs::-webkit-scrollbar{display:none}.focus-tabs button,.focus-follow{flex:none;min-height:27px;height:27px;padding:0 8px;border-radius:4px;background:transparent;border-color:transparent;color:#8b98a7;font-size:10.5px}.focus-tabs button:hover,.focus-follow:hover{background:#141c26;color:#dfe6ed}.focus-tabs button.on{background:#182332;color:#fff;box-shadow:inset 0 -2px 0 var(--act)}.focus-follow{margin-left:auto;border-left:1px solid #253140;border-radius:0;padding-left:10px}.focus-follow.on{color:#65d7a8}
.viz-frame .scroller svg{transition:width .18s ease,viewBox .18s ease}.lab-stage .viz-frame{border-color:#293746;background:#0a0f15}.lab-stage .viz-bar{background:#0d131a}.lab-stage .viz-frame .scroller{background:#0b1016}

/* Chapter 02: one dense simulator viewport, detail cards only on demand. */
.ch-core .core-controls{top:10px;background:rgba(12,17,24,.94);backdrop-filter:blur(14px);border-color:#2a3746}.ch-core .core-controls+.focus-strip{top:102px}.ch-core .core-events{background:#0d131a}.ch-core .inspector-tabs button.on{background:#1a2735;color:#fff;border-color:#34485c}.ch-core .core-gantt{margin:0!important}.ch-core .concept-disclosure:has(.core-gantt){margin-top:22px}

/* The old V2 flex ordering is superseded by the workbench. */

:root[data-theme="dark"]{

  --ink-text:#f6f8fa;

body{background-color:var(--bg);background-size:36px 36px}

/* Guided chapter sequence: preserve depth, expose one cognitive task at a time. */
.learning-journey{
  position:sticky;top:8px;z-index:28;margin:0 0 24px;
  display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:18px;
  padding:10px 12px;border:1px solid #2c3947;border-radius:9px;
  background:rgba(12,17,23,.94);backdrop-filter:blur(18px) saturate(1.1);
  box-shadow:0 14px 42px rgba(0,0,0,.22)
}
.journey-head{min-width:150px}
.journey-head span{display:block;font:700 8.5px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--act)}
.journey-head strong{display:block;margin-top:2px;font-size:12.5px;color:#dce2e8;font-weight:650}
.journey-controls{min-width:0;display:flex;align-items:center;gap:6px}
.journey-track{min-width:0;flex:1;display:grid;grid-template-columns:repeat(var(--journey-count,4),minmax(0,1fr));gap:4px}
.journey-track button{position:relative;min-width:0;min-height:40px;padding:6px 9px;display:flex;align-items:center;gap:8px;border:1px solid transparent;background:transparent;color:#7f8b98;text-align:left}
.journey-track button::after{content:"";position:absolute;left:8px;right:8px;bottom:2px;height:2px;border-radius:2px;background:transparent;transition:background .16s,box-shadow .16s}
.journey-track button:hover{background:#1a232d;color:#f3f6f8}
.journey-track button.on{background:#151d26;color:#fff;border-color:#2d3b4a}
.journey-track button.on::after{background:var(--act);box-shadow:0 0 12px rgba(255,159,67,.36)}
.journey-track b{font:700 9px var(--mono);color:#617080}.journey-track button.on b{color:#ffad56}
.journey-track span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:620}
.journey-arrow,.journey-all{height:34px;min-height:34px;border-color:#2c3947;background:#111821;color:#9ba8b5}
.journey-arrow{width:34px;padding:0;display:grid;place-items:center;font-size:15px}
.journey-arrow:hover,.journey-all:hover{background:#1c2631;color:#fff;border-color:#3a4c5f}
.journey-all{flex:none;padding:0 10px;font-size:10.5px}
.learning-scene{min-width:0;animation:scene-in .28s cubic-bezier(.2,.8,.2,1) both}
.learning-scene[hidden]{display:none!important}
.learning-scene>*+*{margin-top:18px}
.scene-lead{display:grid;grid-template-columns:88px minmax(0,1fr);gap:18px;align-items:start;margin:3px 0 18px!important;padding:0 0 14px;border-bottom:1px solid #202a35}
.scene-kicker{font:700 9px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--act);padding-top:5px}
.scene-lead h2{margin:0;font-size:23px;line-height:1.1;letter-spacing:-.025em;font-weight:680}
.scene-lead p{margin:6px 0 0;max-width:760px;color:var(--tx2);font-size:13.5px;line-height:1.55}
.scene-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:28px!important;padding-top:18px;border-top:1px solid #24303c}
.scene-nav button{min-height:40px}
.scene-prev{background:transparent;color:#93a0ad;border-color:#2c3947}
.scene-prev:hover{background:#18212b;color:#fff}
.scene-next.pri{background:#f0f2f4;color:#0c1015;border-color:#f0f2f4;padding-left:16px;padding-right:16px}
.scene-next.pri:hover{background:#fff;color:#06080b}
.scene-nav-spacer{flex:1}
.guided-all .learning-scene{display:block!important;margin-top:44px;animation:none}
.guided-all .learning-scene:first-of-type{margin-top:0}
@keyframes scene-in{from{opacity:.12;transform:translateY(10px)}to{opacity:1;transform:none}}

/* Focus/camera switcher lives with the diagram, so fullscreen keeps it too. */
.focus-strip{position:sticky;top:0;z-index:12;margin:0;border:0;border-bottom:1px solid #2b3745;border-radius:0;background:rgba(15,21,28,.97);box-shadow:none;padding:6px 8px}
.focus-step{flex:none;width:28px;min-width:28px;height:28px;min-height:28px;padding:0!important;border-color:transparent!important;background:transparent!important;color:#8291a0!important;font-size:15px!important}
.focus-step:hover{background:#202a35!important;color:#fff!important}
.focus-tabs button{min-height:28px;height:28px;color:#8291a0}
.focus-tabs button:hover{background:#1c2631;color:#fff}
.focus-tabs button.on{background:#202a35;color:#fff;box-shadow:inset 0 -2px 0 var(--act)}
.focus-follow{color:#8291a0}.focus-follow.on{color:#64d8aa}
.viz-focus{margin-left:4px!important;border:1px solid #334456!important;background:#18212b!important;color:#d7dee6!important;padding:0 10px!important}
.viz-focus:hover{background:#202c38!important;color:#fff!important;border-color:#455a70!important}
.viz-frame.is-fullscreen{inset:10px;background:#070a0e;border-color:#39495a}
.viz-frame.is-fullscreen .scroller{overflow:auto}
.viz-frame.is-fullscreen .focus-strip{top:38px}
.viz-frame.camera-moving .scroller{cursor:progress}

/* Motion is instructional: scene changes, camera changes and active hardware get one pulse. */
.narr-change{animation:narr-change .28s cubic-bezier(.2,.8,.2,1)}
@keyframes narr-change{from{opacity:.45;transform:translateY(5px)}to{opacity:1;transform:none}}
.step-pulse svg .on.box,.step-pulse svg .on .box{animation:active-box-pop .55s ease-out}
.step-pulse svg .on.wire,.step-pulse svg .on .wire,.step-pulse svg .on.bus,.step-pulse svg .on .bus{animation:active-wire-pop .55s ease-out}
@keyframes active-box-pop{0%{filter:drop-shadow(0 0 0 rgba(255,159,67,0))}35%{filter:drop-shadow(0 0 9px rgba(255,159,67,.5))}100%{filter:drop-shadow(0 0 2px rgba(255,159,67,.12))}}
@keyframes active-wire-pop{0%{stroke-width:2.2;opacity:.45}45%{stroke-width:4.2;opacity:1}100%{opacity:1}}

/* Keep controls visible without allowing them to cover the diagram. */
.lab-rail{top:12px}
.lab-stage{isolation:isolate}
body.viz-open .lab-stage{isolation:auto}
.learning-scene.scene-active .lab-stage>.viz-frame .scroller{max-height:calc(100vh - 185px)}

/* The text hierarchy should not look like one continuous wall. */

/* Term interaction gets enough color to be discoverable without becoming confetti. */
dfn[data-g]{font-weight:560;background:linear-gradient(180deg,transparent 58%,color-mix(in srgb,var(--term) 20%,transparent) 58%)}
dfn[data-g]:hover,dfn[data-g]:focus-visible{color:#fff;background:color-mix(in srgb,var(--term) 24%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--term) 35%,transparent),0 0 18px color-mix(in srgb,var(--term) 12%,transparent)}

@media (max-width:1120px){
  .learning-journey{grid-template-columns:1fr;gap:8px}

/* ========================================================================== */
/* V5 — semantic hardware scenes: no zoom +/-; full-depth guided flow on all  */
/* learning chapters; safe SVG cameras; visible instructional motion.          */
/* ========================================================================== */

/* Stronger hierarchy: page < surfaces < hardware canvas. */
body{background:#07090c;color:#edf2f7}
.app-stage{background:#07090c}
.card{background:#151b23;border-color:#2d3947}
.card:hover{border-color:#405064}
.narr{background:#121820;border-color:#303d4c;border-left-color:var(--act)}
.stepper,.inspector-deck,.concept-disclosure{background:#0e1319}
.lab-stage>.viz-frame,.core-viz,.viz-frame{background:#080c11;border-color:#364557}
.lab-stage>.viz-frame .scroller,.core-viz .scroller,.viz-frame .scroller{background:#080c11}
.viz-bar{background:#111820;border-bottom-color:#2d3947}

/* Navigation: selected is restrained grey; hover is distinctly lighter. */
@media (min-width:901px){
  .nav a{color:#93a0ad}
  .nav a.cur{background:#161d26!important;color:#c5ced8!important;box-shadow:inset 0 0 0 1px #303d4c}
  .nav a.cur .nav-label{color:#c5ced8!important;font-weight:610}
  .nav a:hover{background:#222d39;color:#f7f9fb}
  body:not(.nav-pinned) .sidebar:not(:hover):not(:focus-within) .nav a.cur{background:#151c24!important}
  body:not(.nav-pinned) .sidebar:not(:hover):not(:focus-within) .nav a:hover{background:#263240}
}

/* Disclosures use a directional chevron, never +/- affordances. */
.concept-disclosure>summary i.disclosure-chevron{font-style:normal;font-size:19px;line-height:1;color:#788797;transform:rotate(0deg);transition:transform .18s ease,color .18s ease}
.concept-disclosure>summary:hover i.disclosure-chevron{color:#d6dee7}
.concept-disclosure[open]>summary i.disclosure-chevron{transform:rotate(90deg);color:var(--act)}

/* The SVG is always fitted. Component switching replaces manual zoom/pan. */
.viz-frame .scroller{overflow:hidden!important;cursor:default!important;padding:10px}
.viz-frame .scroller.dragging{cursor:default!important}
.viz-frame .scroller svg{display:block;width:100%!important;height:auto;max-width:none;overflow:visible;transition:none!important}
.viz-bar{height:40px;padding:0 10px 0 13px;gap:8px}
.viz-sub{font:500 9.5px var(--mono);color:#607080;white-space:nowrap}
.viz-focus{min-width:auto!important;height:28px!important;min-height:28px!important;padding:0 10px!important;border:1px solid #3a4a5b!important;background:#18212b!important;color:#c8d2dc!important}
.viz-focus:hover{background:#25313e!important;color:#fff!important;border-color:#52667a!important}
.viz-frame::before,.viz-frame::after{display:none!important}
.viz-frame.is-fullscreen{inset:8px;margin:0;display:flex;flex-direction:column;background:#06080b;border-color:#405165}
.viz-frame.is-fullscreen .scroller{flex:1;min-height:0;display:grid;grid-template:minmax(0,1fr)/minmax(0,1fr);place-items:center;padding:18px}
.viz-frame.is-fullscreen .scroller svg{width:100%!important;height:100%!important}

/* Focus switcher = the primary visualization navigation. */
.focus-strip{height:auto;min-height:44px;display:flex;align-items:center;gap:7px;background:#0e151d;border-bottom:1px solid #2e3a48;padding:7px 9px}
.focus-label{color:#6f7e8d}
.focus-tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:1px}
.focus-tabs button{border:1px solid transparent!important;background:transparent!important;color:#8795a4!important;border-radius:5px!important;transition:background .16s ease,color .16s ease,border-color .16s ease,transform .16s ease}
.focus-tabs button:hover{background:#202b37!important;color:#f3f6f9!important;border-color:#344457!important;transform:translateY(-1px)}
.focus-tabs button.on{background:#1b2632!important;color:#dce5ee!important;border-color:#3a4b5d!important;box-shadow:inset 0 -2px 0 var(--act)!important}
.focus-step{background:#151e27!important;border:1px solid #2f3c4a!important;color:#9eabb8!important;border-radius:5px!important}
.focus-step:hover{background:#263240!important;color:#fff!important;border-color:#46596d!important}
.focus-follow{border-left:0!important;border:1px solid #2f3c4a!important;border-radius:5px!important;background:#141c25!important;color:#8f9dab!important}
.focus-follow.on{color:#72dfb3!important;border-color:#355a4c!important;background:#12231e!important}

/* A view change should be unmistakable but not theatrical. */
.viz-frame{isolation:isolate}
.viz-frame::after{content:"";display:block!important;position:absolute;inset:40px 0 0;z-index:8;pointer-events:none;opacity:0;background:linear-gradient(105deg,transparent 20%,rgba(101,215,168,.055) 45%,rgba(96,165,250,.09) 50%,transparent 76%);transform:translateX(-45%)}
.viz-frame.view-switched::after,.viz-frame.focus-transition::after{animation:view-scan .62s cubic-bezier(.2,.8,.2,1)}
@keyframes view-scan{0%{opacity:0;transform:translateX(-50%)}20%{opacity:1}100%{opacity:0;transform:translateX(55%)}}
.viz-frame.camera-moving{box-shadow:0 0 0 1px #466078,0 14px 42px rgba(0,0,0,.3)}

/* Actual active hardware gets a visible, one-shot state transition. */
svg .attention-pulse{transform-box:fill-box;transform-origin:center;animation:hardware-pop .76s cubic-bezier(.16,1,.3,1)}
svg g.attention-pulse .box,svg g.attention-pulse rect,svg .attention-pulse.box,svg rect.attention-pulse{animation:hardware-fill .76s ease-out}
svg path.attention-pulse,svg line.attention-pulse,svg .attention-pulse .wire{animation:signal-trace .76s ease-out}
@keyframes hardware-pop{0%{filter:drop-shadow(0 0 0 rgba(255,159,67,0));transform:scale(.985)}38%{filter:drop-shadow(0 0 12px rgba(255,159,67,.58));transform:scale(1.012)}100%{filter:drop-shadow(0 0 2px rgba(255,159,67,.08));transform:scale(1)}}
@keyframes hardware-fill{0%{stroke-width:1}42%{stroke-width:2.8}100%{stroke-width:1.2}}
@keyframes signal-trace{0%{opacity:.2;stroke-dashoffset:22;stroke-width:2}45%{opacity:1;stroke-width:4.6}100%{opacity:1;stroke-dashoffset:0}}
.narr-change{animation:narr-v5 .38s cubic-bezier(.2,.8,.2,1)}
@keyframes narr-v5{0%{opacity:.32;transform:translateX(-8px)}55%{opacity:1;transform:translateX(2px)}100%{transform:none}}

/* Guided path is the default across the learning chapters. */
.learning-journey{top:10px;background:rgba(11,16,22,.97);border-color:#303d4b;box-shadow:0 12px 36px rgba(0,0,0,.27)}
.journey-track button{color:#778493}
.journey-track button:hover{background:#202a35;color:#eaf0f5}
.journey-track button.on{background:#17212b;color:#dce5ed;border-color:#354556}
.journey-head strong{color:#d8e0e8}
.scene-lead{border-bottom-color:#273340}
.scene-lead h2{font-size:clamp(22px,2vw,28px)}
.scene-lead p{max-width:720px;color:#a7b2be}
.scene-next.pri{background:#e7ecf1;color:#10151b;border-color:#e7ecf1}
.scene-next.pri:hover{background:#fff;color:#07090c}

/* Simulator workbenches keep controls in sight while the hardware owns space. */
.sim-workbench{display:grid;grid-template-columns:minmax(250px,320px) minmax(0,1fr);gap:16px;align-items:start}
.lab-rail{position:sticky;top:82px;max-height:calc(100vh - 96px);overflow:auto;scrollbar-width:thin;padding-right:3px}
.lab-stage{min-width:0}
.lab-rail .stepper,.lab-rail .scenario-dock,.lab-rail>.stp{background:#111820;border:1px solid #2d3947;border-radius:8px;padding:12px}
.lab-rail .narr{margin-top:10px}
.lab-rail .pills{max-height:132px;overflow:auto}
.generic-workbench .lab-stage>.card{margin-top:12px}

/* Never constrain the hardware canvas to an internal vertical scroll window. */
.learning-scene.scene-active .lab-stage>.viz-frame .scroller{max-height:none!important}

/* Glossary is search-first, not a fake journey. */
